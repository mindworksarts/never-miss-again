<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Never Miss Again</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#0a0d13">
<style>
:root{
  --bg:#080a0f;
  --bg2:#0d1118;
  --panel:#12171f;
  --panel2:#1a212c;
  --panel3:#222b38;
  --border:#232c3a;
  --border2:#2f3a4a;
  --text:#e9eef5;
  --text2:#a4b2c6;
  --muted:#6b7a90;
  --accent:#7b6cff;
  --accent2:#b46cff;
  --amber:#f0b429;
  --red:#ff5b6e;
  --green:#2ed3a0;
  --cyan:#3dd0e8;
  --r:16px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 500px at 12% -8%, rgba(123,108,255,.16), transparent 60%),
    radial-gradient(700px 420px at 92% 4%, rgba(180,108,255,.11), transparent 62%),
    radial-gradient(600px 380px at 50% 100%, rgba(61,208,232,.05), transparent 60%);
}
#app{position:relative;z-index:1;}

/* ---------- Header ---------- */
header{
  position:sticky;top:0;z-index:40;
  background:rgba(8,10,15,.82);backdrop-filter:blur(18px) saturate(1.4);
  border-bottom:1px solid var(--border);
}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px;max-width:1180px;margin:0 auto;}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16.5px;letter-spacing:-.01em;}
.brand .mark{
  width:28px;height:28px;border-radius:9px;flex:0 0 28px;
  background:linear-gradient(145deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-size:15px;
  box-shadow:0 3px 14px rgba(123,108,255,.42);
}
.hactions{display:flex;gap:8px;align-items:center;}

/* ---------- Tabs ---------- */
nav.tabs{
  display:flex;gap:4px;padding:0 14px;overflow-x:auto;scrollbar-width:none;
  max-width:1180px;margin:0 auto;
}
nav.tabs::-webkit-scrollbar{display:none;}
.tab{
  padding:11px 13px;font-size:13.5px;font-weight:600;color:var(--muted);
  cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:.15s;
}
.tab:hover{color:var(--text2);}
.tab.active{color:var(--text);border-bottom-color:var(--accent);}
.tab .dot{display:inline-block;min-width:17px;padding:0 5px;height:17px;line-height:17px;
  border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;text-align:center;margin-left:5px;}

main{max-width:1180px;margin:0 auto;padding:18px 18px calc(60px + var(--safe-b));}
.view{display:none;animation:fade .22s ease;}
.view.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ---------- Type ---------- */
h2{font-size:20px;margin:0 0 3px;letter-spacing:-.02em;}
h3{font-size:16px;margin:0 0 8px;letter-spacing:-.01em;}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px;}
.sect{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);
  font-weight:700;margin:26px 0 10px;display:flex;align-items:center;gap:9px;}
.sect::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);}
.sect:first-child{margin-top:4px;}

/* ---------- Cards ---------- */
.card{
  background:linear-gradient(165deg,var(--panel),var(--bg2));
  border:1px solid var(--border);border-radius:var(--r);padding:16px 17px;margin-bottom:11px;
  transition:.18s;position:relative;overflow:hidden;
}
.card.clk{cursor:pointer;}
.card.clk:hover{border-color:var(--border2);transform:translateY(-1px);
  box-shadow:0 10px 30px rgba(0,0,0,.4);}
.card.urgent{border-color:rgba(255,91,110,.4);}
.card.urgent::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red);}
.card.soon::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--amber);}
.card.soon{border-color:rgba(240,180,41,.28);}

.row{display:flex;gap:10px;align-items:center;}
.between{justify-content:space-between;}
.wrap{flex-wrap:wrap;}
.grow{flex:1;min-width:0;}

.oname{font-weight:650;font-size:15.5px;letter-spacing:-.01em;line-height:1.3;}
.oorg{color:var(--muted);font-size:12px;margin-top:2px;}

/* ---------- Chips & badges ---------- */
.chip{
  display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:7px;
  font-size:11px;font-weight:600;background:var(--panel2);color:var(--text2);
  border:1px solid var(--border);white-space:nowrap;
}
.chip.red{background:rgba(255,91,110,.13);color:#ff8a97;border-color:rgba(255,91,110,.28);}
.chip.amber{background:rgba(240,180,41,.13);color:#f5c65a;border-color:rgba(240,180,41,.28);}
.chip.green{background:rgba(46,211,160,.13);color:#5fe0ba;border-color:rgba(46,211,160,.28);}
.chip.violet{background:rgba(123,108,255,.15);color:#a89dff;border-color:rgba(123,108,255,.3);}
.chip.cyan{background:rgba(61,208,232,.13);color:#7ce0f2;border-color:rgba(61,208,232,.28);}
.chip.ghost{background:transparent;}

.money{font-size:12.5px;color:#5fe0ba;font-weight:600;}
.money.unknown{color:var(--muted);font-weight:500;}

/* fit meter */
.fit{display:inline-flex;gap:2.5px;align-items:center;}
.fit i{width:5px;height:12px;border-radius:2px;background:var(--panel3);display:block;}
.fit i.on{background:linear-gradient(180deg,var(--accent2),var(--accent));}

/* countdown */
.cd{text-align:right;flex:0 0 auto;}
.cd .n{font-size:20px;font-weight:750;letter-spacing:-.03em;line-height:1;}
.cd .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-top:3px;font-weight:600;}
.cd.red .n{color:var(--red);} .cd.amber .n{color:var(--amber);} .cd.green .n{color:var(--green);}
.cd.grey .n{color:var(--muted);font-size:14px;font-weight:600;}

/* ---------- Buttons ---------- */
button,.btn{
  font-family:inherit;font-size:13.5px;font-weight:650;cursor:pointer;border:none;
  padding:9px 15px;border-radius:10px;transition:.15s;display:inline-flex;
  align-items:center;justify-content:center;gap:6px;text-decoration:none;
}
.btn-p{background:linear-gradient(145deg,var(--accent),#6a5aef);color:#fff;
  box-shadow:0 3px 14px rgba(123,108,255,.32);}
.btn-p:hover{filter:brightness(1.1);transform:translateY(-1px);}
.btn-s{background:var(--panel2);color:var(--text);border:1px solid var(--border2);}
.btn-s:hover{background:var(--panel3);}
.btn-g{background:transparent;color:var(--text2);border:1px solid var(--border);}
.btn-g:hover{color:var(--text);border-color:var(--border2);}
.btn-d{background:rgba(255,91,110,.12);color:#ff8a97;border:1px solid rgba(255,91,110,.3);}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px;}
.btn-full{width:100%;}
button:disabled{opacity:.4;cursor:not-allowed;transform:none!important;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}

/* ---------- Filters ---------- */
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;}
.fchip{padding:6px 12px;border-radius:20px;background:var(--panel);border:1px solid var(--border);
  font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:.15s;}
.fchip:hover{color:var(--text2);border-color:var(--border2);}
.fchip.on{background:var(--accent);color:#fff;border-color:var(--accent);}

/* ---------- Stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:6px;}
.stat{background:linear-gradient(165deg,var(--panel),var(--bg2));border:1px solid var(--border);
  border-radius:13px;padding:14px 15px;}
.stat .v{font-size:24px;font-weight:750;letter-spacing:-.03em;line-height:1.1;}
.stat .k{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600;
  text-transform:uppercase;letter-spacing:.06em;}

/* ---------- Forms ---------- */
label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:5px;font-weight:600;
  text-transform:uppercase;letter-spacing:.05em;}
input[type=text],input[type=date],input[type=email],input[type=tel],input[type=url],select,textarea{
  width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg2);color:var(--text);font-family:inherit;font-size:14px;transition:.15s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(123,108,255,.13);}
textarea{min-height:84px;resize:vertical;line-height:1.55;}
.field{margin-bottom:14px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:560px){.g2{grid-template-columns:1fr;}}

/* ---------- Modal ---------- */
.mbd{position:fixed;inset:0;background:rgba(3,5,9,.78);backdrop-filter:blur(6px);
  display:none;align-items:flex-end;justify-content:center;z-index:100;}
.mbd.on{display:flex;}
.modal{background:linear-gradient(175deg,var(--panel),var(--bg2));width:100%;max-width:720px;
  max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;border:1px solid var(--border2);
  border-bottom:none;animation:up .28s cubic-bezier(.2,.9,.3,1);position:relative;}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:760px){.mbd{align-items:center;}
  .modal{border-radius:20px;border-bottom:1px solid var(--border2);max-height:88vh;}}
.mhead{position:sticky;top:0;background:rgba(18,23,31,.96);backdrop-filter:blur(14px);
  padding:18px 54px 14px 20px;border-bottom:1px solid var(--border);z-index:2;}
.mbody{padding:18px 20px 24px;}
.mx{position:absolute;top:15px;right:17px;width:30px;height:30px;border-radius:9px;
  background:var(--panel2);border:1px solid var(--border);color:var(--text2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;z-index:3;}
.mx:hover{background:var(--panel3);color:var(--text);}

/* detail rows */
.drow{padding:12px 0;border-bottom:1px solid var(--border);}
.drow:last-child{border-bottom:none;}
.dk{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);
  font-weight:700;margin-bottom:5px;}
.dv{font-size:14px;line-height:1.6;color:var(--text2);}
.dv strong{color:var(--text);}

.intel{background:linear-gradient(150deg,rgba(123,108,255,.11),rgba(180,108,255,.05));
  border:1px solid rgba(123,108,255,.24);border-radius:13px;padding:14px 15px;margin:14px 0;}
.intel .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#a89dff;
  font-weight:700;margin-bottom:7px;display:flex;align-items:center;gap:6px;}
.intel p{margin:0;font-size:13.5px;line-height:1.65;color:var(--text2);}

.warn{background:rgba(240,180,41,.09);border:1px solid rgba(240,180,41,.28);
  border-radius:11px;padding:11px 13px;margin:12px 0;font-size:13px;color:#f5c65a;line-height:1.55;}
.warn.red{background:rgba(255,91,110,.09);border-color:rgba(255,91,110,.28);color:#ff8a97;}

.banner{border-radius:13px;padding:13px 15px;margin-bottom:11px;font-size:13.5px;line-height:1.55;
  display:flex;gap:11px;align-items:flex-start;}
.banner.red{background:rgba(255,91,110,.1);border:1px solid rgba(255,91,110,.3);color:#ff9ba6;}
.banner.amber{background:rgba(240,180,41,.09);border:1px solid rgba(240,180,41,.28);color:#f5c65a;}
.banner.violet{background:rgba(123,108,255,.1);border:1px solid rgba(123,108,255,.28);color:#b0a6ff;}
.banner b{color:#fff;}

.conf{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;
  padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.05em;}
.conf.confirmed{background:rgba(46,211,160,.14);color:#5fe0ba;}
.conf.high{background:rgba(61,208,232,.13);color:#7ce0f2;}
.conf.medium{background:rgba(240,180,41,.13);color:#f5c65a;}
.conf.low{background:rgba(255,91,110,.12);color:#ff8a97;}
.conf.rolling{background:rgba(123,108,255,.14);color:#a89dff;}
.conf.unknown{background:var(--panel2);color:var(--muted);}

.empty{text-align:center;padding:44px 20px;color:var(--muted);font-size:14px;}
.empty .ic{font-size:30px;margin-bottom:10px;opacity:.5;}

a{color:#a89dff;text-decoration:none;}
a:hover{text-decoration:underline;}

.srcs{font-size:11.5px;color:var(--muted);line-height:1.7;word-break:break-all;}
.srcs a{color:var(--muted);}

/* timeline */
.tl{position:relative;padding-left:22px;}
.tl::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;
  background:linear-gradient(180deg,var(--accent),rgba(123,108,255,.1));border-radius:2px;}
.tli{position:relative;padding:0 0 16px;}
.tli::before{content:'';position:absolute;left:-20px;top:5px;width:9px;height:9px;border-radius:50%;
  background:var(--accent);border:2px solid var(--bg);box-shadow:0 0 0 2px rgba(123,108,255,.28);}
.tli.past::before{background:var(--muted);box-shadow:none;}
.tlm{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;}
.tlt{font-size:14px;font-weight:600;margin-top:2px;}
.tld{font-size:12px;color:var(--muted);margin-top:1px;}

.plist{margin:0;padding-left:18px;}
.plist li{margin-bottom:7px;font-size:13.5px;color:var(--text2);line-height:1.6;}

.qt{border-left:3px solid var(--accent);padding:2px 0 2px 14px;margin:11px 0;
  font-style:italic;color:var(--text);font-size:14px;line-height:1.6;}

.mitem{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding:11px 13px;background:var(--bg2);border:1px solid var(--border);
  border-radius:11px;margin-bottom:7px;}
.tag{display:inline-block;background:var(--panel2);border:1px solid var(--border);
  border-radius:6px;padding:2px 8px;font-size:10.5px;margin:3px 4px 0 0;color:var(--text2);}

/* verdict pills */
.vd{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:8px;
  font-size:11.5px;font-weight:700;letter-spacing:.01em;white-space:nowrap;}
.vd.green{background:rgba(46,211,160,.15);color:#5fe0ba;border:1px solid rgba(46,211,160,.32);}
.vd.cyan{background:rgba(61,208,232,.14);color:#7ce0f2;border:1px solid rgba(61,208,232,.3);}
.vd.amber{background:rgba(240,180,41,.14);color:#f5c65a;border:1px solid rgba(240,180,41,.3);}
.vd.red{background:rgba(255,91,110,.13);color:#ff8a97;border:1px solid rgba(255,91,110,.3);}
.vd.violet{background:rgba(123,108,255,.16);color:#a89dff;border:1px solid rgba(123,108,255,.32);}
.vd.ghost{background:var(--panel2);color:var(--muted);border:1px solid var(--border);}

.matchbox{background:linear-gradient(150deg,rgba(46,211,160,.07),rgba(61,208,232,.03));
  border:1px solid var(--border2);border-radius:14px;padding:14px 15px;margin:14px 0;}
.matchbox .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:9px;}
.matchbox .pn{font-weight:650;font-size:14.5px;}
.matchbox .bl{font-size:12.5px;color:var(--muted);margin-top:2px;}

.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:7px;margin:12px 0 4px;}
.bar .bk{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  font-weight:700;margin-bottom:4px;}
.bar .bt{height:5px;border-radius:3px;background:var(--panel3);overflow:hidden;}
.bar .bf{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.bar .bf.lo{background:linear-gradient(90deg,#ff5b6e,#ff8a97);}
.bar .bf.mid{background:linear-gradient(90deg,#f0b429,#f5c65a);}

.worklist{margin:10px 0 0;padding-left:0;list-style:none;}
.worklist li{position:relative;padding-left:20px;margin-bottom:8px;font-size:13px;
  line-height:1.6;color:var(--text2);}
.worklist li::before{content:'→';position:absolute;left:0;color:var(--amber);font-weight:700;}
.worklist li.good::before{content:'✓';color:var(--green);}
.worklist li.stop::before{content:'✕';color:var(--red);}

.altmatch{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:9px 11px;border-radius:10px;background:var(--bg2);border:1px solid var(--border);
  margin-bottom:6px;cursor:pointer;}
.altmatch:hover{border-color:var(--border2);}

.whychip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;
  border-radius:6px;background:var(--panel2);border:1px solid var(--border);
  color:var(--text2);margin:3px 4px 0 0;}
.whychip .s{font-weight:800;}
.whychip .s.p{color:var(--green);} .whychip .s.m{color:var(--red);} .whychip .s.n{color:var(--muted);}

.readybadge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  padding:2px 7px;border-radius:5px;}
.readybadge.ready{background:rgba(46,211,160,.15);color:#5fe0ba;}
.readybadge.variant{background:rgba(61,208,232,.14);color:#7ce0f2;}
.readybadge.adaptable{background:rgba(240,180,41,.14);color:#f5c65a;}
.readybadge.development{background:rgba(180,108,255,.15);color:#c9a6ff;}
.readybadge.concept{background:rgba(255,91,110,.13);color:#ff8a97;}

.fab{position:fixed;bottom:calc(22px + var(--safe-b));right:20px;width:52px;height:52px;
  border-radius:17px;background:linear-gradient(145deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;
  box-shadow:0 8px 26px rgba(123,108,255,.45);cursor:pointer;z-index:30;transition:.18s;}
.fab:hover{transform:scale(1.06) translateY(-2px);}

.toast{position:fixed;bottom:calc(24px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--panel3);border:1px solid var(--border2);color:var(--text);
  padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:200;
  box-shadow:0 10px 30px rgba(0,0,0,.5);transition:.3s cubic-bezier(.2,.9,.3,1);opacity:0;}
.toast.on{transform:translateX(-50%);opacity:1;}

footer{text-align:center;color:var(--muted);font-size:11.5px;padding:30px 20px 16px;line-height:1.7;}
</style>
</head>
<body>
<div id="app">

<header>
  <div class="hbar">
    <div class="brand"><span class="mark">◈</span> Never Miss Again</div>
    <div class="hactions">
      <button class="btn-g btn-sm" id="notifBtn" onclick="askNotif()">Alerts</button>
      <button class="btn-s btn-sm" onclick="exportICS()">📅 Calendar</button>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main>
  <div class="view active" id="v-dash"></div>
  <div class="view" id="v-opps"></div>
  <div class="view" id="v-playbook"></div>
  <div class="view" id="v-projects"></div>
  <div class="view" id="v-info"></div>
  <div class="view" id="v-settings"></div>
</main>

<div class="fab" id="fab" onclick="openOpp(null)" title="Add opportunity">+</div>

<div class="mbd" id="modal"><div class="modal"><span class="mx" onclick="closeModal()">✕</span><div id="modalContent"></div></div></div>
<div class="toast" id="toast"></div>

<footer>
  Data compiled <b id="compiledDate"></b> from official festival sources.<br>
  Predicted dates are extrapolated from each festival's own history — always verify on the official site before relying on one.<br>
  Everything is stored in this browser. Export a backup from Settings.
</footer>

</div>
<script>
/* ===== data.js ===== */
/* Never Miss Again — researched opportunity dataset
   Compiled 17 August 2026 from official festival sources and verified reporting.
   Every date carries a confidence flag:
     "confirmed"  = published by the organiser, verified
     "predicted"  = extrapolated from that festival's own historical pattern
     "unknown"    = no reliable basis
   `basis` explains the reasoning behind every predicted date so you can judge it.
*/

const DATA_COMPILED = '2026-08-17';

const OPPORTUNITIES = [

/* ============ URGENT / OPEN NOW ============ */
{
  id: 'burj-khalifa',
  name: 'Burj Khalifa Open Call',
  org: 'Emaar Properties',
  city: 'Dubai', country: 'UAE', region: 'Gulf',

/* ===== match.js ===== */
/* Never Miss Again — project ↔ opportunity match engine.

   Answers the question the artist actually has:
     "Do I already own something that fits this, or would I have to build?"

   Produces, per (project, opportunity) pair:
     verdict  — READY / LIGHT / MODERATE / MAJOR / BLOCKED
     score    — 0..100 weighted fit
     reasons  — plain-language positives
     work     — concrete things you'd have to do
     blockers — hard stops
*/

const MEDIUM_ALIASES = {
  drone:['drone','swarm','aerial'],
  circus:['circus','performance','acrobatics','aerial'],
  performance:['performance','circus'],
  led:['led','light','screen','installation'],
  light:['light','led','projection'],
  installation:['installation','sculpture','led','light'],
  interactive:['interactive','immersive','digital'],
  immersive:['immersive','interactive','installation'],
  projection:['projection','screen','light'],
  screen:['screen','projection','animation','digital'],
  digital:['digital','screen','interactive','immersive'],
  sculpture:['sculpture','installation'],
  animation:['animation','screen'],
  aerial:['aerial','circus','performance']
};

function mediumOverlap(projectMediums, seeksMediums){
  if(!seeksMediums || !seeksMediums.length) return {score:0.5, matched:[]};
  const expand = list => {
    const s = new Set();
    list.forEach(m => { s.add(m); (MEDIUM_ALIASES[m]||[]).forEach(a=>s.add(a)); });
    return s;
  };
  const pm = expand(projectMediums);
  const direct = seeksMediums.filter(m => projectMediums.includes(m));
  const loose  = seeksMediums.filter(m => pm.has(m));
  if(direct.length) return {score: Math.min(1, 0.72 + direct.length*0.14), matched:direct};
  if(loose.length)  return {score: Math.min(0.7, 0.4 + loose.length*0.1), matched:loose};
  return {score:0, matched:[]};
}

function formatFit(pFormat, sFormat){
  if(!sFormat || sFormat==='either') return {score:1, note:null};
  if(sFormat==='proposal') return {score:0.9, note:null}; // prize — submit existing work
  if(pFormat===sFormat) return {score:1, note:null};
  if(pFormat==='hybrid') return {score:0.85, note:null};
  const pairs = {
    'performance|installation':{score:0.2, note:'They want a standing installation; this is a timed performance. You would need an object that lives on site between shows, or to pitch the performance as an activation alongside an installation.'},
    'installation|performance':{score:0.3, note:'They want a performance; this is a static installation. It would need a performer or a timed show element built around it.'},
    'performance|screen':{score:0.15, note:'They want screen-based content, not a live act. The show would have to become a film or a projection work.'},
    'installation|screen':{score:0.35, note:'They want screen content. The sphere\'s visual content could be reformatted, but the physical object is not what they are buying.'},
    'performance|sculpture':{score:0.1, note:'They commission sculpture. A live act is a category mismatch.'},
    'installation|sculpture':{score:0.6, note:'They frame this as sculpture rather than media installation — pitch the object, not the technology.'},
    'hybrid|screen':{score:0.3, note:'Screen-based call — only the visual content transfers.'}
  };
  const k = pFormat+'|'+sFormat;
  return pairs[k] || {score:0.3, note:'Format is not a natural match.'};
}

function envFit(project, spec){
  const need = spec.env;
  if(!need || need==='either' || project.env==='either') return {score:1, note:null};
  if(project.env===need) return {score:1, note:null};
  if(project.env==='indoor' && need==='outdoor'){
    return {score:0, hard:true, note:'This work is indoor-only and the opportunity is sited outdoors.'};
  }
  if(project.env==='outdoor' && need==='indoor'){
    return {score:0.5, note:'Designed for outdoor siting; would need adapting to an indoor venue.'};
  }
  return {score:0.6, note:null};
}

function durabilityFit(project, spec){
  const need = spec.runDays || 1;
  const can  = project.runDays || 1;
  if(need <= can) return {score:1, note:null};
  if(project.format==='performance' && project.repeatable){
    // A show can run nightly across a festival run — that's a cost question, not a capability one
    if(need <= 30) return {score:0.75, note:`Runs ${need} days — a performance would need to repeat nightly, which multiplies cost. Price it as a run, not a single show.`};
    return {score:0.3, note:`The opportunity runs ${need} days. A live show cannot cover that without an enormous fee; they likely want a standing work.`};
  }
  if(need > 300) return {score:0.15, note:`Requires a permanent or near-permanent work (${need}+ days). Your rental model does not cover this — it would need to be a purpose-built, owned installation.`};
  if(need > 60)  return {score:0.35, note:`Requires roughly ${Math.round(need/30)} months on site. Beyond your standard rental window — a long-run build and cost model would be needed.`};
  return {score:0.6, note:`Needs to stand for ${need} days, longer than your standard deployment. Workable, but price and durability need rethinking.`};
}

function budgetFit(project, spec){
  const pMin = project.priceMin, pMax = project.priceMax;
  const oMin = spec.payMin, oMax = spec.payMax;
  const prizeLike = spec.format==='proposal' || spec.contentOnly;

  if(oMin===null && oMax===null){
    return {score:0.6, unknown:true, note:'They do not publish what they pay — ask early, before you invest proposal time.'};
  }
  const ceiling = (oMax!==null && oMax!==undefined) ? oMax : oMin;

  // Content-only / prize submissions cost you almost nothing to enter
  if(prizeLike){
    return {score:0.9, note: ceiling>0
      ? `Prize of about $${ceiling.toLocaleString()}. Costs you nothing but time to enter — you are submitting existing work, not deploying it.`
      : 'No cash, but entry costs you nothing but time — you submit existing work rather than deploying it. Judge this on credential value.'};
  }

  if(ceiling === 0){
    if(spec.coversCosts){
      return {score:0.55, gap:true, note:`No artist fee — but travel, accommodation and meals are covered, so your out-of-pocket is limited to crew time and equipment freight. Judge this on prestige, not income.`};
    }
    if(pMin > 2000) return {score:0.2, gap:true, note:`No fee, and no costs covered, against a $${pMin.toLocaleString()} entry price. You would be funding this entirely yourself — only worth it if the credential is genuinely career-changing.`};
    return {score:0.5, note:'No fee — a credential play.'};
  }
  if(ceiling >= pMax) return {score:1, note:`Their budget covers your full range — you could pitch the top tier ($${pMax.toLocaleString()}).`};
  if(ceiling >= pMin){
    let tier=null;
    (project.priceTable||[]).forEach(t=>{ if(t.price<=ceiling && (!tier||t.price>tier.price)) tier=t; });
    return {score:0.85, note: tier
      ? `Affordable at the ${tier.label} tier ($${tier.price.toLocaleString()}). Pitch that scale, not the maximum.`
      : `Their ceiling ($${ceiling.toLocaleString()}) sits inside your range — pitch toward the lower end.`};
  }
  const gap = pMin - ceiling;
  if(ceiling >= pMin*0.6) return {score:0.4, gap:true, note:`Their ceiling is about $${ceiling.toLocaleString()} against your $${pMin.toLocaleString()} entry price — roughly $${gap.toLocaleString()} short. Reachable with a reduced scope or outside funding.`};
  return {score:0.1, gap:true, unfunded:true, note:`They pay up to about $${ceiling.toLocaleString()}. Your entry price is $${pMin.toLocaleString()}. They cannot afford this work — pursue only with a mobility grant or sponsor covering the gap.`};
}

/* Concept clusters — lets "transhumanism" match "negotiating humanity",
   "swarm" match "collective behaviour", and so on. */
const THEME_CLUSTERS = [
  ['humanity','human','transhumanism','singularity','merging','machine','technology','cyborg','body','embodiment','negotiating humanity','human-machine merging','the body and the machine'],
  ['swarm','collective','flock','emergence','autonomy','collective behaviour'],
  ['future','futures','tomorrow','speculative','visions','dreams'],
  ['ecology','nature','environment','climate','sustainability','landscape','desert','water','mangrove'],
  ['participation','interactive','participatory','audience','feedback','connect','connection','encounter'],
  ['data','science','research','information','algorithm'],
  ['spectacle','scale','monumental','wonder','surprise'],
  ['place','site-specific','urban','city','heritage','identity','home','roots'],
  ['light','luminous','night','glow','celestial','planetary','star','celestial'],
  ['transformation','metamorphosis','change','becoming','ritual','legacy'],
  ['circus','virtuosity','balance','gravity','acrobatics','body'],
  ['industrial','post-industrial','decay','machine age','factory']
];
function clustersOf(term){
  const t=term.toLowerCase();
  const out=new Set();
  THEME_CLUSTERS.forEach((c,i)=>{ if(c.some(w=> t.includes(w) || w.includes(t))) out.add(i); });
  return out;
}
function themeFit(project, spec){
  const pt = (project.themes||[]);
  const st = (spec.themes||[]);
  if(!st.length) return {score:0.6, matched:[]};
  const pClusters = new Set();
  pt.forEach(t => clustersOf(t).forEach(c=>pClusters.add(c)));
  const matched=[];
  st.forEach(s=>{
    const sc = clustersOf(s);
    const direct = pt.some(p => p.toLowerCase().includes(s.toLowerCase()) || s.toLowerCase().includes(p.toLowerCase()));
    const shared = [...sc].some(c=>pClusters.has(c));
    if(direct || shared) matched.push(s);
  });
  if(matched.length) return {score:Math.min(1, 0.55 + matched.length*0.18), matched};
  return {score:0.3, matched:[]};
}

function checkGates(project, spec, artist){
  const g = spec.gates||{}; const blockers=[];
  if(g.residency){
    const r=g.residency;
    const ok = (r==='UK'&&artist.ukResident)||(r==='Asia'&&artist.asiaResident)
      ||(r==='CZ/SK'&&artist.czechSlovak)||(r==='EU'&&artist.euResident)||(r==='Perm'&&false);
    if(!ok) blockers.push(`Residency restricted (${r}). ${g.note||''}`.trim());
  }
  if(g.identity) blockers.push(`Identity-restricted call: ${g.identity}.`);
  if(g.maxAge && artist.birthYear){
    const age = new Date().getFullYear() - artist.birthYear;
    if(age > g.maxAge) blockers.push(`Age limit ${g.minAge||0}–${g.maxAge}; you would be ${age}. ${g.note?'Exceptions exist — see notes.':''}`);
  }
  if(g.minAge && artist.birthYear){
    const age = new Date().getFullYear() - artist.birthYear;
    if(age < g.minAge) blockers.push(`Minimum age ${g.minAge}; you would be ${age}.`);
  }
  return blockers;
}

function matchProject(project, opp, artist){
  const spec = SPECS[opp.id];
  if(!spec) return null;

  const blockers = checkGates(project, spec, artist);
  const med  = mediumOverlap(project.mediums, spec.mediums);
  const fmt  = formatFit(project.format, spec.format);
  const env  = envFit(project, spec);
  const dur  = durabilityFit(project, spec);
  const bud  = budgetFit(project, spec);
  const thm  = themeFit(project, spec);

  const reasons=[], work=[];

  if(med.matched.length) reasons.push(`Medium matches what they program (${med.matched.join(', ')}).`);
  else work.push('Medium is outside what they normally program — you would be arguing them into a new category.');

  if(fmt.note) work.push(fmt.note);
  if(env.note){ (env.hard?blockers:work).push(env.note); }
  if(dur.note) work.push(dur.note);
  // Affordability is a commercial judgement, never an eligibility block
  if(bud.note) work.push(bud.note);
  if(bud.score===1) reasons.push('Their budget comfortably covers your pricing.');
  if(thm.matched.length) reasons.push(`Theme overlap: ${thm.matched.join(', ')}.`);

  if(project.rigging===true && /rigging|rigger/i.test(spec.needs||'')===false && spec.format==='installation'){
    work.push('Needs a certified rigger and an approved rigging point — confirm the venue can provide one.');
  }

  const sp = SPECIFIC_WORK[opp.id];
  if(sp && sp.match(project)) work.push(sp.work);

  const W = {med:.28, fmt:.22, env:.13, dur:.11, bud:.20, thm:.06};
  let score = (med.score*W.med + fmt.score*W.fmt + env.score*W.env
             + dur.score*W.dur + bud.score*W.bud + thm.score*W.thm) * 100;

  // A serious format mismatch means you're proposing a different kind of object —
  // no amount of budget or theme alignment should mask that.
  if(fmt.score < 0.35) score *= 0.7;
  if(med.score < 0.35) score *= 0.75;

  // readiness penalty — an unbuilt work is not the same as a tourable one
  const readyMult = {ready:1, variant:0.97, adaptable:0.88, development:0.74, concept:0.5}[project.readiness] || 1;
  score = score * readyMult;
  const invitation = !!(spec.gates||{}).invitation;
  if(blockers.length) score = Math.min(score, 20);
  score = Math.round(Math.max(0, Math.min(100, score)));

  // How much building is required, independent of whether it's worth doing
  let buildLevel;
  if(project.readiness==='concept') buildLevel='MAJOR';
  else if(project.readiness==='development') buildLevel='MODERATE';
  else {
    const structural = work.filter(w=>/new build|purpose-built|weatheris|from scratch|different product class|rebuild/i.test(w)).length;
    if(structural) buildLevel='MAJOR';
    else if(score>=74 && work.filter(w=>!/budget covers|do not publish/i.test(w)).length<=1) buildLevel='READY';
    else if(score>=55) buildLevel='LIGHT';
    else buildLevel='MODERATE';
  }

  let verdict = buildLevel;
  if(blockers.length) verdict='BLOCKED';
  else if(invitation) verdict='RELATIONSHIP';
  else if(bud.unfunded) verdict='UNFUNDED';

  return {
    projectId:project.id, projectName:project.name, oppId:opp.id,
    score, verdict, buildLevel, reasons, work, blockers,
    invitation, unfunded: !!bud.unfunded, costGap: !!bud.gap,
    parts:{medium:med.score, format:fmt.score, environment:env.score,
           durability:dur.score, budget:bud.score, theme:thm.score},
    budgetNote: bud.note, readiness: project.readiness
  };
}

/* Best match across the whole catalogue for one opportunity.
   Prefers a usable route over a merely high-scoring blocked one. */
function bestMatch(opp, projects, artist){
  const all = projects.map(p=>matchProject(p, opp, artist)).filter(Boolean);
  if(!all.length) return null;
  const rank = {READY:7, LIGHT:6, MODERATE:5, RELATIONSHIP:4, UNFUNDED:3, MAJOR:2, BLOCKED:1};
  all.sort((a,b)=> (rank[b.verdict]-rank[a.verdict]) || (b.score-a.score));
  return {best:all[0], all};
}

const VERDICT_META = {

  LIGHT:       {label:'Light adaptation', cls:'cyan',   icon:'◐', blurb:'Existing work with bounded changes — reformatting, rescoring, restaging.'},
  MODERATE:    {label:'Moderate build',   cls:'amber',  icon:'◑', blurb:'Real development reusing your core assets. Budget time before the deadline.'},

/* ===== learn.js ===== */
/* Never Miss Again — adaptive interest.

   Learns what you actually go after, from three signals:
     1. Interest ratings you set by hand        (strongest — a direct statement)
     2. Applications you mark submitted/applied (revealed preference — you spent real effort)
     3. Outcomes (accepted / rejected)          (calibration — what actually lands)

   Every suggestion is explainable. Nothing is a black box: the UI shows the
   specific signals that produced a number, and a hand-set rating always wins.
*/

const LEARN_DIMS = ['region','category','moneyTier','format','tier'];

function dimsOf(opp){
  const spec = (typeof SPECS!=='undefined' && SPECS[opp.id]) || {};
  return {
    region: opp.region || '—',
    category: opp.category || '—',
    moneyTier: opp.moneyTier || 'unknown',
    format: spec.format || '—',
    tier: opp.tier || '—'
  };
}

/* Build preference weights from the user's own history. */
function buildPreferences(state, opportunities){
  const tally = {};
  LEARN_DIMS.forEach(d => tally[d] = {});

  const bump = (dim, val, amount) => {
    if(val==null || val==='—') return;
    const t = tally[dim];
    if(!t[val]) t[val] = {sum:0, n:0};
    t[val].sum += amount; t[val].n += 1;
  };

  let signals = 0;
  opportunities.forEach(o => {
    const u = state.user[o.id];
    if(!u) return;
    const d = dimsOf(o);

    // 1. explicit rating, centred so 2 (medium) is neutral
    if(u.interest !== undefined && u.interestManual){
      const v = (u.interest - 2) / 2;      // -1 .. +1
      LEARN_DIMS.forEach(k => bump(k, d[k], v * 1.0));
      signals++;
    }
    // 2. revealed preference — effort spent
    const st = (u.status||'').toLowerCase();
    if(['drafting','submitted','accepted','rejected'].includes(st)){
      LEARN_DIMS.forEach(k => bump(k, d[k], 0.8));
      signals++;
    }
    // 3. outcomes
    if(st==='accepted'){ LEARN_DIMS.forEach(k => bump(k, d[k], 0.6)); signals++; }
    if(st==='declined by me' || st==='not pursuing'){
      LEARN_DIMS.forEach(k => bump(k, d[k], -0.9)); signals++;
    }
    if(u.dismissed){ LEARN_DIMS.forEach(k => bump(k, d[k], -1.0)); signals++; }
  });

  // average, and shrink toward zero when evidence is thin
  const prefs = {};
  LEARN_DIMS.forEach(dim => {
    prefs[dim] = {};
    Object.entries(tally[dim]).forEach(([val,{sum,n}]) => {
      const mean = sum / n;
      const confidence = n / (n + 2);      // 1 obs → .33, 3 → .6, 8 → .8
      prefs[dim][val] = mean * confidence;
    });
  });
  return {prefs, signals};
}

/* Suggest an interest level 0..4 for an opportunity. */
function suggestInterest(opp, match, state, prefs){
  const why = [];
  let score = 0;

  // Match quality is the backbone
  if(match){
    const vBase = {READY:1.0, LIGHT:0.75, MODERATE:0.35, RELATIONSHIP:0.5,
                   UNFUNDED:0.1, MAJOR:-0.2, BLOCKED:-1.2}[match.verdict] ?? 0;
    score += vBase;
    if(match.verdict==='READY') why.push({t:'You already own something that fits', v:'+'});
    else if(match.verdict==='LIGHT') why.push({t:'Fits with light adaptation', v:'+'});
    else if(match.verdict==='BLOCKED') why.push({t:'You are not eligible', v:'−'});
    else if(match.verdict==='UNFUNDED') why.push({t:'Cannot pay near your price', v:'−'});
    else if(match.verdict==='MAJOR') why.push({t:'Would need a major build', v:'−'});
    else if(match.verdict==='RELATIONSHIP') why.push({t:'Fits, but invitation-only', v:'~'});
    else if(match.verdict==='MODERATE') why.push({t:'Would need real development', v:'~'});
  }

  // Money
  const mBoost = {top:0.55, high:0.4, medium:0.15, prestige:0.1, low:-0.1, unknown:0}[opp.moneyTier] ?? 0;
  score += mBoost;
  if(mBoost>=0.4) why.push({t:'Well funded', v:'+'});
  if(mBoost<0) why.push({t:'Low budget', v:'−'});

  // Deadline reality — a passed or absent date shouldn't inflate urgency
  const st = opp.status;
  if(st==='at_risk'){ score -= 0.4; why.push({t:'Event at risk of cancellation', v:'−'}); }
  if(st==='restricted'){ score -= 0.3; why.push({t:'Access restricted', v:'−'}); }

  // Learned preference
  if(prefs && prefs.signals >= 3){
    const d = dimsOf(opp);
    let learned = 0; const hits=[];
    LEARN_DIMS.forEach(k=>{
      const w = (prefs.prefs[k]||{})[d[k]];
      if(w) { learned += w; if(Math.abs(w)>0.25) hits.push({k, val:d[k], w}); }
    });
    learned = Math.max(-1, Math.min(1, learned/2));
    score += learned * 0.7;
    hits.sort((a,b)=>Math.abs(b.w)-Math.abs(a.w));
    hits.slice(0,2).forEach(h=>{
      why.push({t:`You tend to ${h.w>0?'pursue':'skip'} ${h.val} opportunities`, v:h.w>0?'+':'−'});
    });
  }

  // map to 0..4
  let level;
  if(score >= 1.15) level = 4;
  else if(score >= 0.7) level = 3;
  else if(score >= 0.25) level = 2;
  else if(score >= -0.35) level = 1;
  else level = 0;

  return {level, score, why};
}

/* Human-readable summary of what the app has learned so far. */
function preferenceSummary(prefs){
  if(!prefs || prefs.signals < 3) return null;
  const out = [];
  LEARN_DIMS.forEach(dim=>{
    const entries = Object.entries(prefs.prefs[dim]||{})
      .filter(([,w])=>Math.abs(w)>0.2)
      .sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
    entries.slice(0,3).forEach(([val,w])=>{
      out.push({dim, val, w, dir: w>0?'toward':'away from'});
    });
  });
  return out.sort((a,b)=>Math.abs(b.w)-Math.abs(a.w)).slice(0,8);
}

    });
  });
  return merged.filter(o => !o.dismissed);
}
function setUser(id, patch){
  S.user[id] = Object.assign({}, S.user[id]||{}, patch);
  save();
  recomputePrefs();
}

/* effective date for sorting/alerts: confirmed deadline first, else predicted */
function effDate(o){ return o.deadline || o.predictedDeadline || o.opensDate || null; }
function isPredicted(o){ return !o.deadline && !!o.predictedDeadline; }

function statusChip(o){
  const map = {
    open:['green','Open now'], opens_soon:['cyan','Opens soon'], predicted:['violet','Predicted cycle'],
    rolling:['violet','Rolling — no deadline'], invitation:['amber','Invitation only'],
    uncertain:['amber','Uncertain'], restricted:['amber','Restricted'], at_risk:['red','At risk']
  };
  const [c,l] = map[o.status] || ['ghost', o.status||'—'];
  return `<span class="chip ${c}">${l}</span>`;
}
function confChip(o){
  if(o.deadline) return `<span class="conf confirmed">✓ Confirmed</span>`;
  if(o.deadlineConfidence==='rolling'||o.status==='rolling') return `<span class="conf rolling">Rolling</span>`;
  if(o.predictedConfidence) return `<span class="conf ${o.predictedConfidence}">◷ Predicted · ${o.predictedConfidence} confidence</span>`;
  return `<span class="conf unknown">No date</span>`;
}
function fitBar(n){
  let h='<span class="fit">';
  for(let i=0;i<5;i++) h+=`<i class="${i<n?'on':''}"></i>`;
  return h+'</span>';
}
function moneyClass(t){ return (t==='unknown'||!t) ? 'money unknown' : 'money'; }
function moneyLabel(o){
  const m={top:'Top budget',high:'High',medium:'Mid',low:'Low',prestige:'Prestige, little/no cash',unknown:'Budget unknown'};
  return m[o.moneyTier]||'—';
}

function cdBlock(o){
  const ds = effDate(o);
  const d = daysTo(ds);
  if(o.status==='rolling') return `<div class="cd grey"><div class="n">Rolling</div><div class="l">any time</div></div>`;
  if(o.status==='invitation') return `<div class="cd grey"><div class="n">Invite</div><div class="l">no open call</div></div>`;
  if(d===null) return `<div class="cd grey"><div class="n">TBA</div><div class="l">watch</div></div>`;
  if(d<0) return `<div class="cd grey"><div class="n">Passed</div><div class="l">${fmtDate(ds)}</div></div>`;
  const cls = d<=14?'red':d<=45?'amber':'green';
  return `<div class="cd ${cls}"><div class="n">${d}</div><div class="l">${d===1?'day left':'days left'}</div></div>`;
}

/* ---------- tabs ---------- */
let activeTab='dash';
function renderTabs(){
  const urgent = allOpps().filter(o=>{const d=daysTo(effDate(o));return o.deadline&&d!==null&&d>=0&&d<=30;}).length;
  const revs = (S.revisions||[]).length;
  $('tabs').innerHTML = TABS.map(t=>{
    let dot='';
    if(t.id==='opps'&&urgent) dot=`<span class="dot">${urgent}</span>`;
    if(t.id==='settings'&&revs) dot=`<span class="dot">${revs}</span>`;
    return `<div class="tab ${t.id===activeTab?'active':''}" onclick="go('${t.id}')">${t.label}${dot}</div>`;
  }).join('');
}
function go(id){
  activeTab=id;
  clearMatchCache();
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  $('v-'+id).classList.add('active');
  renderTabs();
  $('fab').style.display = (id==='opps'||id==='projects') ? 'flex' : 'none';
  ({dash:renderDash,opps:renderOpps,playbook:renderPlaybook,projects:renderProjects,info:renderInfo,settings:renderSettings})[id]();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- dashboard ---------- */
function renderDash(){
  const opps = allOpps();
  const dated = opps.filter(o=>effDate(o) && daysTo(effDate(o))>=0);
  dated.sort((a,b)=>daysTo(effDate(a))-daysTo(effDate(b)));

  const confirmedSoon = dated.filter(o=>o.deadline && daysTo(o.deadline)<=45);
  const openNow = opps.filter(o=>o.status==='open');
  const highFit = opps.filter(o=>o.fit>=4).length;
  const funded = opps.filter(o=>['top','high'].includes(o.moneyTier)).length;

  let h = `<h2>Dashboard</h2><p class="sub">${opps.length} opportunities tracked · ${openNow.length} open right now · data compiled ${fmtDate(DATA_COMPILED)}</p>`;

  // revision alerts
  if((S.revisions||[]).length){
    h += `<div class="banner violet"><span>🔄</span><div><b>${S.revisions.length} date revision${S.revisions.length>1?'s':''} detected.</b> Review them in Settings → Revision log.</div></div>`;
  }

  // urgent
  const urgent = confirmedSoon.filter(o=>daysTo(o.deadline)<=21);
  urgent.forEach(o=>{
    const d=daysTo(o.deadline);
    h += `<div class="banner ${d<=7?'red':'amber'}" onclick="openDetail('${o.id}')" style="cursor:pointer">
      <span>${d<=7?'🚨':'⏰'}</span>
      <div><b>${esc(o.name)}</b> — ${d===0?'closes TODAY':d===1?'closes tomorrow':`${d} days left`}
      ${o.moneyTier==='top'||o.moneyTier==='high'?` · ${esc(o.money.split('.')[0])}`:''}</div></div>`;
  });

  h += `<div class="stats" style="margin-top:16px">
    <div class="stat"><div class="v" style="color:var(--green)">${openNow.length}</div><div class="k">Open now</div></div>
    <div class="stat"><div class="v" style="color:var(--amber)">${confirmedSoon.length}</div><div class="k">Confirmed &lt;45d</div></div>
    <div class="stat"><div class="v">${highFit}</div><div class="k">Strong fit</div></div>
    <div class="stat"><div class="v" style="color:var(--cyan)">${funded}</div><div class="k">Well funded</div></div>
  </div>`;

  h += `<div class="sect">Next 12 months</div><div class="tl">`;
  const next12 = dated.filter(o=>daysTo(effDate(o))<=400).slice(0,22);
  let lastMonth='';
  next12.forEach(o=>{
    const ds=effDate(o), d=daysTo(ds);
    const mo = new Date(ds+'T00:00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'});
    if(mo!==lastMonth){ h+=`<div class="tlm" style="margin:14px 0 8px">${mo}</div>`; lastMonth=mo; }
    h += `<div class="tli" onclick="openDetail('${o.id}')" style="cursor:pointer">
      <div class="tlt">${esc(o.name)} ${isPredicted(o)?'<span class="conf '+(o.predictedConfidence||'low')+'" style="margin-left:4px">predicted</span>':'<span class="conf confirmed" style="margin-left:4px">confirmed</span>'}</div>
      <div class="tld">${fmtDate(ds)} · ${d} days · ${esc(o.city)}, ${esc(o.country)}</div>
    </div>`;
  });
  h += `</div>`;

  // ready-to-pitch surfacing
  const readyNow = opps.filter(o=>o.match&&['READY','LIGHT'].includes(o.match.verdict))
    .filter(o=>{const dd=daysTo(effDate(o)); return dd!==null&&dd>=0&&dd<=200;})
    .sort((a,b)=>daysTo(effDate(a))-daysTo(effDate(b))).slice(0,6);
  if(readyNow.length){
    h += `<div class="sect">You already have something for these</div>`;
    readyNow.forEach(o=>{
      const m=o.match, v=VERDICT_META[m.verdict], dd=daysTo(effDate(o));
      h+=`<div class="card clk" onclick="openDetail('${o.id}')">
        <div class="row between" style="align-items:flex-start">
          <div class="grow"><div class="oname" style="font-size:14.5px">${esc(o.name)}</div>
          <div style="font-size:12.5px;color:var(--text2);margin-top:4px">${esc(shortProjName(m.projectName))} · ${esc(moneyLabel(o))}</div></div>
          <div style="text-align:right">${verdictPill(m)}
          <div style="font-size:11px;color:var(--muted);margin-top:5px">${dd}d</div></div>
        </div></div>`;
    });
  }

  h += `<div class="sect">Do this now</div>`;
  h += `<div class="card"><ul class="plist">
    <li><b>Set standing tender alerts</b> for "drone show" on <a href="https://www.instantmarkets.com/q/drone_show" target="_blank">InstantMarkets</a>, <a href="https://www.bidnetdirect.com/" target="_blank">BidNet</a> and <a href="https://www.find-tender.service.gov.uk/" target="_blank">Find a Tender</a>. This is the highest-volume paid drone channel and almost nobody in the art world competes for it.</li>
    <li><b>Watch the Amsterdam Light Festival open call page</b> — Edition 16 opens early September 2026 and they've said the process is changing.</li>
    <li><b>Write to FulFive / FiveCurrents about LA28</b> — 2028 ceremony subcontracting decisions get made well before 2027.</li>
    <li><b>Fill in your project profiles and My Info</b> so application autofill actually saves you time.</li>
    <li><b>Export the calendar file</b> (📅 button, top right) and import it into Google Calendar to fill the next year with every key date.</li>
  </ul></div>`;

  $('v-dash').innerHTML = h;
}

/* ---------- opportunities ---------- */
let fStatus='all', fRegion='all', fSort='deadline';
function renderOpps(){
  let list = allOpps();

  if(fStatus==='open') list=list.filter(o=>o.status==='open');
  else if(fStatus==='confirmed') list=list.filter(o=>!!o.deadline);
  else if(fStatus==='drone') list=list.filter(o=>(o.drones||'').toLowerCase().startsWith('yes')||o.category==='drone');
  else if(fStatus==='funded') list=list.filter(o=>['top','high'].includes(o.moneyTier));
  else if(fStatus==='ready') list=list.filter(o=>o.match&&o.match.verdict==='READY');
  else if(fStatus==='nobuild') list=list.filter(o=>o.match&&['READY','LIGHT'].includes(o.match.verdict));
  else if(fStatus==='eligible') list=list.filter(o=>o.match&&o.match.verdict!=='BLOCKED');
  else if(fStatus==='invitation') list=list.filter(o=>o.status==='invitation');

  if(fRegion!=='all') list=list.filter(o=>o.region===fRegion);

  if(fSort==='deadline'){
    list.sort((a,b)=>{
      const da=daysTo(effDate(a)), db=daysTo(effDate(b));
      const A = da===null||da<0 ? 99999 : da, B = db===null||db<0 ? 99999 : db;
      return A-B;
    });
  } else if(fSort==='fit') list.sort((a,b)=>(b.match?b.match.score:0)-(a.match?a.match.score:0));
  else if(fSort==='money'){
    const rank={top:5,high:4,medium:3,prestige:2,low:1,unknown:0};
    list.sort((a,b)=>(rank[b.moneyTier]||0)-(rank[a.moneyTier]||0));
  } else if(fSort==='interest') list.sort((a,b)=>b.interest-a.interest);

  const regions=[...new Set(allOpps().map(o=>o.region))].sort();
  const readyCount = allOpps().filter(o=>o.match&&o.match.verdict==='READY').length;

  let h=`<h2>Opportunities</h2><p class="sub">Each card shows which of your projects fits and how much you'd have to build.</p>`;
  h+=`<div class="filters">
    ${[['all','All'],['ready',`Ready to pitch${readyCount?' · '+readyCount:''}`],['nobuild','No major build'],['open','Open now'],['confirmed','Confirmed dates'],['funded','Well funded'],['drone','Takes drones'],['eligible','Eligible only'],['invitation','Invitation only']]
      .map(([k,l])=>`<div class="fchip ${fStatus===k?'on':''}" onclick="fStatus='${k}';renderOpps()">${l}</div>`).join('')}
  </div>`;
  h+=`<div class="filters">
    <div class="fchip ${fRegion==='all'?'on':''}" onclick="fRegion='all';renderOpps()">All regions</div>
    ${regions.map(r=>`<div class="fchip ${fRegion===r?'on':''}" onclick="fRegion='${r}';renderOpps()">${r}</div>`).join('')}
  </div>`;
  h+=`<div class="filters">
    <span style="font-size:12px;color:var(--muted);align-self:center;margin-right:2px">Sort:</span>
    ${[['deadline','Soonest'],['fit','Best fit'],['money','Biggest budget'],['interest','My interest']]
      .map(([k,l])=>`<div class="fchip ${fSort===k?'on':''}" onclick="fSort='${k}';renderOpps()">${l}</div>`).join('')}
  </div>`;

  h += list.length ? list.map(oppCard).join('')
    : `<div class="empty"><div class="ic">🔍</div>Nothing matches those filters.</div>`;

  $('v-opps').innerHTML=h;
}

function verdictPill(m, compact){
  if(!m) return '';
  const v = VERDICT_META[m.verdict];
  return `<span class="vd ${v.cls}">${v.icon} ${compact?v.label:v.label}</span>`;
}
function shortProjName(n){ return n.replace(/ — .*$/,'').replace(/\s*\(.*\)$/,''); }

function oppCard(o){
  const ds=effDate(o), d=daysTo(ds);
  const cls = (o.deadline&&d!==null&&d>=0&&d<=14)?'urgent':(o.deadline&&d!==null&&d>=0&&d<=45)?'soon':'';
  const m = o.match;
  return `<div class="card clk ${cls}" onclick="openDetail('${o.id}')">
    <div class="row between" style="align-items:flex-start">
      <div class="grow">
        <div class="oname">${esc(o.name)}</div>
        <div class="oorg">${esc(o.org)} · ${esc(o.city)}, ${esc(o.country)}</div>
      </div>
      ${cdBlock(o)}
    </div>
    ${m?`<div class="row wrap" style="margin-top:11px;gap:7px;align-items:center">
      ${verdictPill(m)}
      <span style="font-size:12px;color:var(--text2)">${esc(shortProjName(m.projectName))}</span>
    </div>`:''}
    <div class="row wrap" style="margin-top:9px;gap:6px">
      ${statusChip(o)}
      <span class="chip">${esc(o.category)}</span>
      ${(o.drones||'').toLowerCase().startsWith('yes')?'<span class="chip cyan">🚁 drones</span>':''}
      ${o.warning?'<span class="chip amber">⚠ note</span>':''}
    </div>
    <div class="row between wrap" style="margin-top:10px;gap:8px">
      <span class="${moneyClass(o.moneyTier)}">${esc(moneyLabel(o))}</span>
      <span class="row" style="gap:6px">
        <span style="font-size:11px;color:var(--muted)">${o.interestManual?'interest':'suggested'}</span>${fitBar(o.interest+1)}
      </span>
    </div>
    ${ds?`<div style="margin-top:9px;font-size:12px;color:var(--muted)">${o.deadline?'Deadline':o.opensDate&&!o.predictedDeadline?'Opens':'Predicted deadline'}: ${fmtDate(ds)} ${confChip(o)}</div>`:''}
  </div>`;
}

function barRow(parts){
  const keys=[['medium','Medium'],['format','Format'],['environment','Venue'],
              ['durability','Duration'],['budget','Budget'],['theme','Theme']];
  return `<div class="bars">${keys.map(([k,l])=>{
    const v=Math.round((parts[k]||0)*100);
    const cls = v<40?'lo':v<70?'mid':'';
    return `<div class="bar"><div class="bk">${l}</div><div class="bt"><div class="bf ${cls}" style="width:${v}%"></div></div></div>`;
  }).join('')}</div>`;
}

function matchPanel(o){
  const m = o.match; if(!m) return '';
  const v = VERDICT_META[m.verdict];
  let h = `<div class="sect">Do you already have something for this?</div>`;
  h += `<div class="matchbox">
    <div class="top">
      <div class="grow">
        <div class="pn">${esc(m.projectName)}</div>
        <div class="bl">${esc(v.blurb)}</div>
      </div>
      <div style="text-align:right;flex:0 0 auto">
        ${verdictPill(m)}
        <div style="font-size:11px;color:var(--muted);margin-top:5px">${m.score}/100 fit</div>
      </div>
    </div>
    ${barRow(m.parts)}
    <ul class="worklist">
      ${m.blockers.map(b=>`<li class="stop">${esc(b)}</li>`).join('')}
      ${m.reasons.map(r=>`<li class="good">${esc(r)}</li>`).join('')}
      ${m.work.map(w=>`<li>${esc(w)}</li>`).join('')}
    </ul>
  </div>`;

  const alts = (o.matchAll||[]).filter(x=>x.projectId!==m.projectId)

  if(alts.length){
    h += `<div style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:14px 0 8px">Your other work against this</div>`;
    alts.forEach(a=>{

      h+=`<div class="altmatch" onclick="event.stopPropagation();showMatchDetail('${o.id}','${a.projectId}')">

        <div style="font-size:11.5px;color:var(--muted);margin-top:2px">${a.score}/100</div></div>
        <span class="vd ${av.cls}">${av.icon} ${av.label}</span>

  }
  return h;
}

const READY_LABEL = {ready:'Ready', variant:'Variant', adaptable:'Adaptable',
                     development:'In development', concept:'Concept'};

function renderProjects(){
  let h=`<h2>Projects</h2><p class="sub">Your catalogue, and where each piece actually lands. Tap a project to see every opportunity it fits.</p>`;
  const opps = allOpps();
  h += S.projects.map(p=>{

      .filter(x=>x.m);
    const ready = scored.filter(x=>x.m.verdict==='READY').length;
    const light = scored.filter(x=>x.m.verdict==='LIGHT').length;
    const rel   = scored.filter(x=>x.m.verdict==='RELATIONSHIP').length;
    return `<div class="card clk" onclick="openProjectFits('${p.id}')">
      <div class="row between" style="align-items:flex-start">
        <div class="grow">
          <div class="oname">${esc(p.name)}</div>
          <div style="font-size:13px;color:var(--text2);margin-top:5px;line-height:1.6">${esc(p.oneLine||p.short||'')}</div>
        </div>
        <span class="readybadge ${p.readiness||'ready'}">${READY_LABEL[p.readiness]||'Ready'}</span>
      </div>
      <div class="row wrap" style="gap:7px;margin-top:11px">
        ${ready?`<span class="vd green">✓ ${ready} ready</span>`:''}
        ${light?`<span class="vd cyan">◐ ${light} light adapt</span>`:''}
        ${rel?`<span class="vd violet">◈ ${rel} relationship</span>`:''}
      </div>
      ${p.priceMin?`<div style="margin-top:10px" class="money">$${p.priceMin.toLocaleString()}${p.priceMax&&p.priceMax!==p.priceMin?' – $'+p.priceMax.toLocaleString():''}</div>`:''}
      <div style="margin-top:9px">${(p.tags||[]).slice(0,6).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
    </div>`;
  }).join('');
  h+=`<div class="btnrow"><button class="btn-s" onclick="openProject(null)">+ New project</button></div>`;
  $('v-projects').innerHTML=h;
}

function openProjectFits(pid){
  const p = S.projects.find(x=>x.id===pid); if(!p) return;
  const opps = allOpps();
  const scored = opps.map(o=>({o, m:(o.matchAll||[]).find(x=>x.projectId===pid)}))
    .filter(x=>x.m);
  const rank={READY:7,LIGHT:6,MODERATE:5,RELATIONSHIP:4,UNFUNDED:3,MAJOR:2,BLOCKED:1};
  scored.sort((a,b)=>(rank[b.m.verdict]-rank[a.m.verdict])||(b.m.score-a.m.score));

  let h=`<div class="mhead">
    <div class="row between" style="align-items:flex-start">
      <div class="grow"><h3 style="margin:0;font-size:18px">${esc(p.name)}</h3></div>
      <span class="readybadge ${p.readiness||'ready'}">${READY_LABEL[p.readiness]||'Ready'}</span>
    </div>
  </div><div class="mbody">
  <div style="font-size:13.5px;color:var(--text2);line-height:1.65">${esc(p.oneLine||'')}</div>`;

  if(p.limits) h+=`<div class="warn" style="margin-top:12px"><b>Constraint:</b> ${esc(p.limits)}</div>`;
  if(p.strengths) h+=`<div class="intel"><div class="lbl">◈ What this wins on</div><p>${esc(p.strengths)}</p></div>`;

  if(p.priceTable&&p.priceTable.length){
    h+=`<div class="sect">Pricing</div>`;
    p.priceTable.forEach(t=>{
      h+=`<div class="row between" style="padding:7px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:13.5px">${esc(t.label)}</span>
        <span class="money">$${t.price.toLocaleString()}</span></div>`;
    });
    if(p.priceNote) h+=`<div style="font-size:12px;color:var(--muted);margin-top:8px">${esc(p.priceNote)}</div>`;
  }

  const groups=[['READY','Pitch as-is'],['LIGHT','Light adaptation'],['MODERATE','Moderate build'],
                ['RELATIONSHIP','Relationship plays'],['UNFUNDED','Fits but underfunded'],
                ['MAJOR','Major build'],['BLOCKED','Not eligible']];
  groups.forEach(([v,label])=>{
    const g=scored.filter(x=>x.m.verdict===v);
    if(!g.length) return;
    h+=`<div class="sect">${label} · ${g.length}</div>`;
    g.slice(0,14).forEach(({o,m})=>{
      const ds=effDate(o), d=daysTo(ds);
      h+=`<div class="altmatch" onclick="openDetail('${o.id}')">
        <div class="grow">
          <div style="font-size:13.5px;font-weight:600">${esc(o.name)}</div>
          <div style="font-size:11.5px;color:var(--muted);margin-top:2px">
            ${esc(moneyLabel(o))}${ds&&d>=0?` · ${d}d`:''} · ${m.score}/100</div>
        </div>
        <span style="font-size:11px;color:var(--muted)">→</span>
      </div>`;
    });
  });

  h+=`<div class="btnrow"><button class="btn-s" onclick="openProject('${pid}')">Edit this project</button></div></div>`;
  $('modalContent').innerHTML=h; $('modal').classList.add('on');
}

function renderMedia(){
  $('mediaList').innerHTML = curMedia.length ? curMedia.map((m,i)=>`
    <div class="mitem"><div class="grow">
      <div style="font-weight:600;font-size:13.5px">${esc(m.label)} <span style="color:var(--muted);font-weight:400">· ${esc(m.type)}</span></div>
      ${m.url?`<div style="font-size:11.5px;margin-top:3px"><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.url.slice(0,54))}${m.url.length>54?'…':''}</a></div>`:''}
      <div>${(m.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
    </div><button class="btn-d btn-sm" onclick="rmMedia(${i})">Remove</button></div>`).join('')
    : `<div style="color:var(--muted);font-size:13px;margin-bottom:10px">No media yet. Paste links to your reels, stills and tech riders — tag them so you can find the right asset fast when an application asks for it.</div>`;
}
function addMedia(){
  const l=$('m_label').value.trim(); if(!l){toast('Give it a label');return;}
  curMedia.push({id:uid(),label:l,type:$('m_type').value,url:$('m_url').value.trim(),
    tags:$('m_tags').value.split(',').map(s=>s.trim()).filter(Boolean)});
  $('m_label').value='';$('m_url').value='';$('m_tags').value='';
  renderMedia();
}
function rmMedia(i){ curMedia.splice(i,1); renderMedia(); }
function saveProject(){
  const n=$('pr_name').value.trim(); if(!n){toast('Name required');return;}
  const num=v=>{const x=parseInt(String(v).replace(/[^0-9]/g,''),10); return isNaN(x)?null:x;};
  const data=Object.assign({}, curProj, {id:curProj.id,name:n,
    oneLine:$('pr_short').value,long:$('pr_long').value,
    readiness:$('pr_ready').value, format:$('pr_format').value, env:$('pr_env').value,
    mediums:$('pr_mediums').value.split(',').map(s=>s.trim()).filter(Boolean),
    priceMin:num($('pr_pmin').value), priceMax:num($('pr_pmax').value),
    duration:$('pr_duration').value,count:$('pr_count').value,tech:$('pr_tech').value,
    pricing:$('pr_pricing').value,logistics:$('pr_logistics').value,
    tags:$('pr_tags').value.split(',').map(s=>s.trim()).filter(Boolean),media:curMedia});
  const i=S.projects.findIndex(p=>p.id===curProj.id);
  if(i>=0) S.projects[i]=data; else S.projects.push(data);
  save(); clearMatchCache(); recomputePrefs(); closeModal(); renderProjects(); toast('Project saved — matches recalculated');
}
function delProject(id){
  if(!confirm('Delete this project?'))return;
  S.projects=S.projects.filter(p=>p.id!==id); save(); clearMatchCache(); closeModal(); renderProjects();
}

    <div style="font-size:13px;color:var(--text2);line-height:1.65">New versions load automatically the next time you open the app while online — you do not need to reinstall. Your ratings, notes and projects are stored separately and are never touched by an update.<br><br>If a new version does not appear, use Force update to clear the offline cache and reload.</div>
    <div class="btnrow"><button class="btn-s" onclick="forceUpdate()">⟳ Force update</button></div>
  </div>`;

  h+=`<div class="sect">About the data</div><div class="card">
    <div style="font-size:13.5px;color:var(--text2);line-height:1.7">
    Compiled <b>${fmtDate(DATA_COMPILED)}</b> from official festival sources, organiser pages and verified reporting. Every source URL is listed on each opportunity's detail page.<br><br>
    <b>Confidence labels:</b><br>
    <span class="conf confirmed">✓ Confirmed</span> published by the organiser and verified.<br>
    <span class="conf high">◷ High</span> the festival has run the same cycle for 2+ verified years.<br>
    <span class="conf medium">◷ Medium</span> based on a single verified prior cycle.<br>
    <span class="conf low">◷ Low</span> irregular history, or the organiser has signalled a change — verify before relying on it.<br><br>
    Corrections made during research: <b>NUR</b> is in Kazan, Russia (not Sharjah, UAE) · <b>Otkriće</b> is in Montenegro (not Russia/Serbia) · <b>Saliari</b> is the International Salieri Circus Award in Legnago, Italy · <b>Rendr</b> is a Belfast screen-industry festival, not a projection festival.
    </div>
  </div>`;

  $('v-settings').innerHTML=h;
}

function snapshot(){
  const s={};
  OPPORTUNITIES.forEach(o=>{ s[o.id]={d:o.deadline||null,p:o.predictedDeadline||null,st:o.status}; });
  return s;
}
function checkRevisions(){
  const now=snapshot();
  if(!S.seenData){ S.seenData=now; save(); toast('Baseline saved — future changes will be flagged'); return; }
  const revs=[];
  const when=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  Object.keys(now).forEach(id=>{
    const old=S.seenData[id], cur=now[id];
    const o=OPPORTUNITIES.find(x=>x.id===id);
    if(!old){ revs.push({name:o.name,change:'New opportunity added to the dataset.',when}); return; }
    if(old.d!==cur.d){
      revs.push({name:o.name,change: !old.d&&cur.d
        ? `Deadline CONFIRMED as ${fmtDate(cur.d)} (was a prediction).`
        : `Deadline changed: ${old.d?fmtDate(old.d):'none'} → ${cur.d?fmtDate(cur.d):'none'}.`,when});
    } else if(old.p!==cur.p){
      revs.push({name:o.name,change:`Predicted deadline revised: ${old.p?fmtDate(old.p):'none'} → ${cur.p?fmtDate(cur.p):'none'}.`,when});
    }
    if(old.st!==cur.st) revs.push({name:o.name,change:`Status changed: ${old.st} → ${cur.st}.`,when});
  });
  S.seenData=now;
  if(revs.length){
    S.revisions=(S.revisions||[]).concat(revs); save();
    if('Notification' in window && Notification.permission==='granted')
      new Notification('Never Miss Again',{body:`${revs.length} date revision${revs.length>1?'s':''} detected. Open the app to review.`});
    toast(`${revs.length} revision${revs.length>1?'s':''} found`);
  } else { save(); toast('No changes since last check'); }
  renderSettings(); renderTabs();
}

/* ---------- calendar export ---------- */
function icsDate(ds){ return ds.replace(/-/g,''); }
function icsEsc(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function buildICS(confirmedOnly){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Never Miss Again//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Never Miss Again'];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  let n=0;
  allOpps().forEach(o=>{
    const ds = o.deadline || (confirmedOnly?null:o.predictedDeadline);
    if(!ds) return;
    const d=daysTo(ds); if(d<-30) return;
    const pred = !o.deadline;
    const end=new Date(ds+'T00:00:00'); end.setDate(end.getDate()+1);
    const endS=end.toISOString().slice(0,10).replace(/-/g,'');
    const title=`${pred?'[PREDICTED] ':''}Deadline: ${o.name}`;
    const desc=[
      pred?`⚠ PREDICTED DATE (${o.predictedConfidence} confidence) — verify on the official site.`:'✓ Confirmed deadline.',
      o.basis?`Basis: ${o.basis}`:'',
      `Money: ${o.money}`,
      `What: ${o.what}`,
      o.requirements?`Requirements: ${o.requirements}`:'',
      o.intel?`Strategic read: ${o.intel}`:'',
      o.warning?`⚠ ${o.warning}`:'',
      `Apply: ${o.applyUrl||o.website}`
    ].filter(Boolean).join('\n\n');
    L.push('BEGIN:VEVENT',`UID:nma-${o.id}-${icsDate(ds)}@nevermissagain`,`DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${icsDate(ds)}`,`DTEND;VALUE=DATE:${endS}`,
      `SUMMARY:${icsEsc(title)}`,`DESCRIPTION:${icsEsc(desc)}`,
      `LOCATION:${icsEsc(o.city+', '+o.country)}`,`URL:${icsEsc(o.applyUrl||o.website)}`);
    [[-30,'30 days'],[-14,'2 weeks'],[-7,'1 week'],[-2,'2 days']].forEach(([days,lbl])=>{
      L.push('BEGIN:VALARM',`TRIGGER:-P${Math.abs(days)}D`,'ACTION:DISPLAY',
        `DESCRIPTION:${icsEsc(lbl+' until '+o.name+' deadline')}`,'END:VALARM');
    });
    L.push('END:VEVENT'); n++;

    // event window as a note event
    if(o.eventWindow && !pred){
      // skip — keep the calendar focused on actionable deadlines
    }
  });
  L.push('END:VCALENDAR');
  return {ics:L.join('\r\n'), count:n};
}
function exportICS(confirmedOnly){
  const {ics,count}=buildICS(confirmedOnly);
  dl(new Blob([ics],{type:'text/calendar'}), `never-miss-again${confirmedOnly?'-confirmed':''}.ics`);
  toast(`${count} dates exported`);
}
function addOneToCal(id){
  const o=allOpps().find(x=>x.id===id); if(!o) return;
  const ds=effDate(o); if(!ds){toast('No date to add');return;}
  const end=new Date(ds+'T00:00:00'); end.setDate(end.getDate()+1);
  const pred=!o.deadline;
  const url='https://calendar.google.com/calendar/render?action=TEMPLATE'
    +'&text='+encodeURIComponent(`${pred?'[PREDICTED] ':''}Deadline: ${o.name}`)
    +'&dates='+icsDate(ds)+'/'+end.toISOString().slice(0,10).replace(/-/g,'')
    +'&details='+encodeURIComponent(
      (pred?`⚠ PREDICTED (${o.predictedConfidence} confidence) — verify on the official site.\n\n`:'✓ Confirmed deadline.\n\n')
      +`Money: ${o.money}\n\nApply: ${o.applyUrl||o.website}`)
    +'&location='+encodeURIComponent(o.city+', '+o.country);
  window.open(url,'_blank');
}
function dl(blob,name){
  const u=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);
}

/* ---------- backup ---------- */
function exportJSON(){
  dl(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),
    `never-miss-again-backup-${new Date().toISOString().slice(0,10)}.json`);
  toast('Backup downloaded');
}
function importJSON(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result);
    if(!d.projects&&!d.user) throw 0;
    S=Object.assign(blank(),d); save(); toast('Backup imported'); go('dash');
  }catch{ toast('Could not read that file'); } };
  r.readAsText(f); e.target.value='';
}
function unhideAll(){ Object.keys(S.user).forEach(k=>{ if(S.user[k]) S.user[k].dismissed=false; }); save(); toast('Restored'); renderSettings(); }
function wipe(){ if(!confirm('Erase all your ratings, notes, projects and info?'))return;
  localStorage.removeItem(KEY); S=blank(); location.reload(); }

/* ---------- notifications ---------- */
function askNotif(){
  if(!('Notification' in window)){toast('Notifications not supported here');return;}
  Notification.requestPermission().then(p=>{
    $('notifBtn').textContent = p==='granted'?'Alerts on ✓':'Alerts';
    if(p==='granted'){ toast('Alerts enabled'); fireAlerts(); }
  });
}
function fireAlerts(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const marks=[30,14,7,2,0];
  allOpps().forEach(o=>{
    if(!o.deadline)return;
    const d=daysTo(o.deadline);
    if(marks.includes(d)){
      new Notification('Never Miss Again',{
        body: d===0?`Deadline TODAY: ${o.name}`:`${d} day${d===1?'':'s'} left to apply: ${o.name}`
      });
    }
  });
}

async function forceUpdate(){
  toast('Clearing cache…');
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.controller)
      navigator.serviceWorker.controller.postMessage('nuke-cache');
    if(window.caches){
      const keys = await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    if(navigator.serviceWorker){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
  }catch(e){}
  setTimeout(()=>location.reload(true), 600);
}

function toggleArtist(k){ S.artist[k]=!S.artist[k]; save(); clearMatchCache(); renderSettings(); }
function saveArtist(){
  const b=parseInt($('ar_birth').value,10);
  S.artist.birthYear = isNaN(b)?null:b;
  save(); clearMatchCache(); recomputePrefs();
  toast('Eligibility updated — matches recalculated'); renderSettings();
}

/* ---------- init ---------- */
$('compiledDate').textContent=fmtDate(DATA_COMPILED);
recomputePrefs();
if('Notification' in window && Notification.permission==='granted') $('notifBtn').textContent='Alerts on ✓';
if(!S.seenData){ S.seenData=snapshot(); save(); }
renderTabs(); go('dash');
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
setTimeout(fireAlerts,1500);
setInterval(fireAlerts,1000*60*60*12);

</script>
