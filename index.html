/* effective date for sorting/alerts: confirmed deadline first, else predicted */
function effDate(o){ return o.deadline || o.predictedDeadline || o.opensDate || null; }
function isPredicted(o){ return !o.deadline && !!o.predictedDeadline; }

function statusChip(o){
  const map = {
    open:['green','Open now'], opens_soon:['cyan','Opens soon'], predicted:['violet','Predicted cycle'],
    rolling:['violet','Rolling — no deadline'], invitation:['amber','Invitation only'],
    uncertain:['amber','Uncertain'], restricted:['amber','Restricted'], at_risk:['red','At risk']
  };
  const [c,l] = map[o.status] || ['ghost', o.status||'—'];
  return `<span class="chip ${c}">${l}</span>`;
}
function confChip(o){
  if(o.deadline) return `<span class="conf confirmed">✓ Confirmed</span>`;
  if(o.deadlineConfidence==='rolling'||o.status==='rolling') return `<span class="conf rolling">Rolling</span>`;
  if(o.predictedConfidence) return `<span class="conf ${o.predictedConfidence}">◷ Predicted · ${o.predictedConfidence} confidence</span>`;
  return `<span class="conf unknown">No date</span>`;
}
function fitBar(n){
  let h='<span class="fit">';
  for(let i=0;i<5;i++) h+=`<i class="${i<n?'on':''}"></i>`;
  return h+'</span>';
}
function moneyClass(t){ return (t==='unknown'||!t) ? 'money unknown' : 'money'; }
function moneyLabel(o){
  const m={top:'Top budget',high:'High',medium:'Mid',low:'Low',prestige:'Prestige, little/no cash',unknown:'Budget unknown'};
  return m[o.moneyTier]||'—';
}

function cdBlock(o){
  const ds = effDate(o);
  const d = daysTo(ds);
  if(o.status==='rolling') return `<div class="cd grey"><div class="n">Rolling</div><div class="l">any time</div></div>`;
  if(o.status==='invitation') return `<div class="cd grey"><div class="n">Invite</div><div class="l">no open call</div></div>`;
  if(d===null) return `<div class="cd grey"><div class="n">TBA</div><div class="l">watch</div></div>`;
  if(d<0) return `<div class="cd grey"><div class="n">Passed</div><div class="l">${fmtDate(ds)}</div></div>`;
  const cls = d<=14?'red':d<=45?'amber':'green';
  return `<div class="cd ${cls}"><div class="n">${d}</div><div class="l">${d===1?'day left':'days left'}</div></div>`;
}

/* ---------- tabs ---------- */
let activeTab='dash';
function renderTabs(){
  const urgent = allOpps().filter(o=>{const d=daysTo(effDate(o));return o.deadline&&d!==null&&d>=0&&d<=30;}).length;
  const revs = (S.revisions||[]).length;
  $('tabs').innerHTML = TABS.map(t=>{
    let dot='';
    if(t.id==='opps'&&urgent) dot=`<span class="dot">${urgent}</span>`;
    if(t.id==='settings'&&revs) dot=`<span class="dot">${revs}</span>`;
    return `<div class="tab ${t.id===activeTab?'active':''}" onclick="go('${t.id}')">${t.label}${dot}</div>`;
  }).join('');
}
function go(id){
  activeTab=id;
  clearMatchCache();
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  $('v-'+id).classList.add('active');
  renderTabs();
  $('fab').style.display = (id==='opps'||id==='projects') ? 'flex' : 'none';
  ({dash:renderDash,opps:renderOpps,insights:renderInsights,projects:renderProjects,info:renderInfo,settings:renderSettings})[id]();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- dashboard ---------- */
function renderDash(){
  const opps = allOpps();
  const dated = opps.filter(o=>effDate(o) && daysTo(effDate(o))>=0);
  dated.sort((a,b)=>daysTo(effDate(a))-daysTo(effDate(b)));

  const confirmedSoon = dated.filter(o=>o.deadline && daysTo(o.deadline)<=45);
  const openNow = opps.filter(o=>o.status==='open');
  const highFit = opps.filter(o=>o.fit>=4).length;
  const funded = opps.filter(o=>['top','high'].includes(o.moneyTier)).length;

  let h = `<h2>Dashboard</h2><p class="sub">${opps.length} opportunities tracked · ${openNow.length} open right now · data compiled ${fmtDate(DATA_COMPILED)}</p>`;

  // revision alerts
  if((S.revisions||[]).length){
    h += `<div class="banner violet"><span>🔄</span><div><b>${S.revisions.length} date revision${S.revisions.length>1?'s':''} detected.</b> Review them in Settings → Revision log.</div></div>`;
  }

  // urgent
  const urgent = confirmedSoon.filter(o=>daysTo(o.deadline)<=21);
  urgent.forEach(o=>{
    const d=daysTo(o.deadline);
    h += `<div class="banner ${d<=7?'red':'amber'}" onclick="openDetail('${o.id}')" style="cursor:pointer">
      <span>${d<=7?'🚨':'⏰'}</span>
      <div><b>${esc(o.name)}</b> — ${d===0?'closes TODAY':d===1?'closes tomorrow':`${d} days left`}
      ${o.moneyTier==='top'||o.moneyTier==='high'?` · ${esc(o.money.split('.')[0])}`:''}</div></div>`;
  });

  h += `<div class="stats" style="margin-top:16px">
    <div class="stat"><div class="v" style="color:var(--green)">${openNow.length}</div><div class="k">Open now</div></div>
    <div class="stat"><div class="v" style="color:var(--amber)">${confirmedSoon.length}</div><div class="k">Confirmed &lt;45d</div></div>
    <div class="stat"><div class="v">${highFit}</div><div class="k">Strong fit</div></div>
    <div class="stat"><div class="v" style="color:var(--cyan)">${funded}</div><div class="k">Well funded</div></div>
  </div>`;

  h += `<div class="sect">Next 12 months</div><div class="tl">`;
  const next12 = dated.filter(o=>daysTo(effDate(o))<=400).slice(0,22);
  let lastMonth='';
  next12.forEach(o=>{
    const ds=effDate(o), d=daysTo(ds);
    const mo = new Date(ds+'T00:00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'});
    if(mo!==lastMonth){ h+=`<div class="tlm" style="margin:14px 0 8px">${mo}</div>`; lastMonth=mo; }
    h += `<div class="tli" onclick="openDetail('${o.id}')" style="cursor:pointer">
      <div class="tlt">${esc(o.name)} ${isPredicted(o)?'<span class="conf '+(o.predictedConfidence||'low')+'" style="margin-left:4px">predicted</span>':'<span class="conf confirmed" style="margin-left:4px">confirmed</span>'}</div>
      <div class="tld">${fmtDate(ds)} · ${d} days · ${esc(o.city)}, ${esc(o.country)}</div>
    </div>`;
  });
  h += `</div>`;

  // ready-to-pitch surfacing
  const readyNow = opps.filter(o=>o.match&&['READY','LIGHT'].includes(o.match.verdict))
    .filter(o=>{const dd=daysTo(effDate(o)); return dd!==null&&dd>=0&&dd<=200;})
    .sort((a,b)=>daysTo(effDate(a))-daysTo(effDate(b))).slice(0,6);
  if(readyNow.length){
    h += `<div class="sect">You already have something for these</div>`;
    readyNow.forEach(o=>{
      const m=o.match, v=VERDICT_META[m.verdict], dd=daysTo(effDate(o));
      h+=`<div class="card clk" onclick="openDetail('${o.id}')">
        <div class="row between" style="align-items:flex-start">
          <div class="grow"><div class="oname" style="font-size:14.5px">${esc(o.name)}</div>
          <div style="font-size:12.5px;color:var(--text2);margin-top:4px">${esc(shortProjName(m.projectName))} · ${esc(moneyLabel(o))}</div></div>
          <div style="text-align:right">${verdictPill(m)}
          <div style="font-size:11px;color:var(--muted);margin-top:5px">${dd}d</div></div>
        </div></div>`;
    });
  }

  // pitch windows open right now — the LUMA lesson made actionable
  const nm = new Date().getMonth()+1;
  const windowsOpen = opps.filter(o=>o.pitchWindow && o.pitchWindow.months.includes(nm)
    && o.pitchWindow.months.length<12 && o.match && o.match.verdict!=='BLOCKED');
  if(windowsOpen.length){
    h += `<div class="sect">Pitch windows open this month</div>`;
    h += `<div class="banner amber"><span>◉</span><div>These have <b>no published open call</b> — but this is the month a cold approach actually lands, because programming locks 6–9 months before the event. This is exactly how LUMA Small Works worked.</div></div>`;
    windowsOpen.slice(0,6).forEach(o=>{
      h+=`<div class="card clk" onclick="openDetail('${o.id}')">
        <div class="row between" style="align-items:flex-start">
          <div class="grow"><div class="oname" style="font-size:14.5px">${esc(o.name)}</div>
          <div style="font-size:12.5px;color:var(--text2);margin-top:4px">${esc(o.city)}, ${esc(o.country)} · ${esc(moneyLabel(o))}</div></div>
          <span class="vd green">◉ open</span>
        </div></div>`;
    });
  }

  h += `<div class="sect">Do this now</div>`;
  h += `<div class="card"><ul class="plist">
    <li><b>Email business@balichws.com</b> with the 60-second drone circus reel. They produce Noor Riyadh, Olympic ceremonies and Expo shows, and they publish a business-development address — one relationship reaches all three.</li>
    <li><b>Register at la28.supplierone.co</b> and submit to <b>fivecurrents.com/talent</b>. Ceremony teams staff up 18–24 months out, which is now.</li>
    <li><b>Apply to the Texas Touring Roster.</b> It turns your show into a part-funded purchase for every presenter in your home state — the highest-leverage domestic move available.</li>
    <li><b>Send an EPK to casting@spiegelworld.com.</b> Their house style is exactly StarBalancer's register.</li>
    <li><b>Set a SAM.gov alert</b> for "Expo 2027 Belgrade" — the US Pavilion contractor solicitation is the only genuinely open Expo procurement a US company can bid into.</li>
    <li><b>Build the 45-minute version of Singularity.</b> MICC Montréal, CIRCa and every European co-production route require a full production. This one decision unlocks the entire touring tier.</li>
    <li><b>Set standing tender alerts</b> for "drone show" on <a href="https://www.instantmarkets.com/q/drone_show" target="_blank">InstantMarkets</a> and <a href="https://www.bidnetdirect.com/" target="_blank">BidNet</a>.</li>
  </ul></div>`;

  $('v-dash').innerHTML = h;
}

/* ---------- opportunities ---------- */
let fStatus='all', fRegion='all', fSort='deadline', fMedium='all';
function renderOpps(){
  let list = allOpps();

  if(fStatus==='open') list=list.filter(o=>o.status==='open');
  else if(fStatus==='confirmed') list=list.filter(o=>!!o.deadline);
  else if(fStatus==='window') list=list.filter(o=>o.pitchWindow && o.pitchWindow.months.includes(new Date().getMonth()+1));
  else if(fStatus==='contacts') list=list.filter(o=>o.contacts && o.contacts.length);
  else if(fStatus==='funded') list=list.filter(o=>['top','high'].includes(o.moneyTier));
  else if(fStatus==='ready') list=list.filter(o=>o.match&&o.match.verdict==='READY');
  else if(fStatus==='nobuild') list=list.filter(o=>o.match&&['READY','LIGHT'].includes(o.match.verdict));
  else if(fStatus==='eligible') list=list.filter(o=>o.match&&o.match.verdict!=='BLOCKED');
  else if(fStatus==='invitation') list=list.filter(o=>o.status==='invitation');

  if(fRegion!=='all') list=list.filter(o=>o.region===fRegion);
  if(fMedium!=='all') list=list.filter(o=>(o.mediums||[]).includes(fMedium));

  if(fSort==='deadline'){
    list.sort((a,b)=>{
      const da=daysTo(effDate(a)), db=daysTo(effDate(b));
      const A = da===null||da<0 ? 99999 : da, B = db===null||db<0 ? 99999 : db;
      return A-B;
    });
  } else if(fSort==='fit') list.sort((a,b)=>(b.match?b.match.score:0)-(a.match?a.match.score:0));
  else if(fSort==='align') list.sort((a,b)=>(b.align?b.align.score:0)-(a.align?a.align.score:0) || (b.match?b.match.score:0)-(a.match?a.match.score:0));
  else if(fSort==='money'){
    const rank={top:5,high:4,medium:3,prestige:2,low:1,unknown:0};
    list.sort((a,b)=>(rank[b.moneyTier]||0)-(rank[a.moneyTier]||0));
  } else if(fSort==='interest') list.sort((a,b)=>b.interest-a.interest);

  const regions=[...new Set(allOpps().map(o=>o.region))].sort();
  const readyCount = allOpps().filter(o=>o.match&&o.match.verdict==='READY').length;
  const nowMonth = new Date().getMonth()+1;
  const windowCount = allOpps().filter(o=>o.pitchWindow&&o.pitchWindow.months.includes(nowMonth)&&o.pitchWindow.months.length<12).length;

  let h=`<h2>Opportunities</h2><p class="sub">Each card shows which of your projects fits and how much you'd have to build.</p>`;
  h+=`<div class="filters">
    ${[['all','All'],['ready',`Ready to pitch${readyCount?' · '+readyCount:''}`],['nobuild','No major build'],['open','Open now'],['window',`Pitch window open${windowCount?' · '+windowCount:''}`],['confirmed','Confirmed dates'],['funded','Well funded'],['contacts','Has contacts'],['eligible','Eligible only'],['invitation','Invitation only']]
      .map(([k,l])=>`<div class="fchip ${fStatus===k?'on':''}" onclick="fStatus='${k}';renderOpps()">${l}</div>`).join('')}
  </div>`;
  const activeMediums = [...new Set(allOpps().flatMap(o=>o.mediums||[]))].filter(m=>MEDIUMS[m]);
  const medOrder = ['circus','performance','aerial','streetarts','variety','spectacle','light','projection','led','newmedia','digital','interactive','immersive','installation','sculpture','screen','drone','sound'];
  activeMediums.sort((a,b)=>medOrder.indexOf(a)-medOrder.indexOf(b));
  h+=`<div class="filters">
    <span style="font-size:12px;color:var(--muted);align-self:center;margin-right:2px">Medium:</span>
    <div class="fchip ${fMedium==='all'?'on':''}" onclick="fMedium='all';renderOpps()">Any</div>
    ${activeMediums.map(m=>`<div class="fchip ${fMedium===m?'on':''}" onclick="fMedium='${m}';renderOpps()">${MEDIUMS[m].short}</div>`).join('')}
  </div>`;
  h+=`<div class="filters">
    <div class="fchip ${fRegion==='all'?'on':''}" onclick="fRegion='all';renderOpps()">All regions</div>
    ${regions.map(r=>`<div class="fchip ${fRegion===r?'on':''}" onclick="fRegion='${r}';renderOpps()">${r}</div>`).join('')}
  </div>`;
  h+=`<div class="filters">
    <span style="font-size:12px;color:var(--muted);align-self:center;margin-right:2px">Sort:</span>
    ${[['deadline','Soonest'],['fit','Best fit'],['align','Focus match'],['money','Biggest budget'],['interest','My interest']]
      .map(([k,l])=>`<div class="fchip ${fSort===k?'on':''}" onclick="fSort='${k}';renderOpps()">${l}</div>`).join('')}
  </div>`;

  h += list.length ? list.map(oppCard).join('')
    : `<div class="empty"><div class="ic">🔍</div>Nothing matches those filters.</div>`;

  $('v-opps').innerHTML=h;
}

function verdictPill(m, compact){
  if(!m) return '';
  const v = VERDICT_META[m.verdict];
  return `<span class="vd ${v.cls}">${v.icon} ${compact?v.label:v.label}</span>`;
}
function shortProjName(n){ return n.replace(/ — .*$/,'').replace(/\s*\(.*\)$/,''); }

function medClass(m){
  const f = (MEDIUMS[m]||{}).family;
  return f==='performance'?'perf':f==='technology'?'tech':f==='object'?'obj':'';
}
function medChips(mediums, max){
  const list = mediumChips(mediums, max);
  const extra = (mediums||[]).filter(m=>MEDIUMS[m]).length - list.length;
  return list.map(m=>`<span class="med ${medClass(m)}">${MEDIUMS[m].short}</span>`).join('')
    + (extra>0?`<span class="med">+${extra}</span>`:'');
}
function alignBlock(a){
  if(!a) return '';
  let dots='';
  for(let i=0;i<5;i++) dots+=`<i class="${i<a.score?'on':''}"></i>`;
  return `<div class="align"><span class="dots">${dots}</span>
    <span class="txt"><b>${esc(a.label)}</b> — ${esc(a.note)}</span></div>`;
}
const MONTH_ABBR=['J','F','M','A','M','J','J','A','S','O','N','D'];
function windowBlock(w){
  if(!w) return '';
  const now = new Date().getMonth()+1;
  const open = w.months.includes(now);
  const always = w.months.length===12;
  return `<div class="window ${open?'now':''}">
    <div class="wl">${open?'◉ Pitch window is open now':'◷ Pitch window'}${w.label?' · '+esc(w.label):''}</div>
    <p style="margin:0;font-size:13px;line-height:1.65;color:var(--text2)">${esc(w.why)}</p>
    ${always?'':`<div class="months">${MONTH_ABBR.map((m,i)=>
      `<span class="${w.months.includes(i+1)?'on':''} ${i+1===now?'cur':''}">${m}</span>`).join('')}</div>`}
  </div>`;
}

function oppCard(o){
  const ds=effDate(o), d=daysTo(ds);
  const cls = (o.deadline&&d!==null&&d>=0&&d<=14)?'urgent':(o.deadline&&d!==null&&d>=0&&d<=45)?'soon':'';
  const m = o.match;
  return `<div class="card clk ${cls}" onclick="openDetail('${o.id}')">
    <div class="row between" style="align-items:flex-start">
      <div class="grow">
        <div class="oname">${esc(o.name)}</div>
        <div class="oorg">${esc(o.org)} · ${esc(o.city)}, ${esc(o.country)}</div>
      </div>
      ${cdBlock(o)}
    </div>
    ${m?`<div class="row wrap" style="margin-top:11px;gap:7px;align-items:center">
      ${verdictPill(m)}
      <span style="font-size:12px;color:var(--text2)">${esc(shortProjName(m.projectName))}</span>
    </div>`:''}
    <div class="row wrap" style="margin-top:9px;gap:5px">
      ${statusChip(o)}
      ${medChips(o.mediums, 4)}
      ${o.warning?'<span class="chip amber">⚠ note</span>':''}
    </div>
    <div class="row between wrap" style="margin-top:10px;gap:8px">
      <span class="${moneyClass(o.moneyTier)}">${esc(moneyLabel(o))}</span>
      <span class="row" style="gap:6px">
        <span style="font-size:11px;color:var(--muted)">${o.interestManual?'interest':'suggested'}</span>${fitBar(o.interest+1)}
      </span>
    </div>
    ${ds?`<div style="margin-top:9px;font-size:12px;color:var(--muted)">${o.deadline?'Deadline':o.opensDate&&!o.predictedDeadline?'Opens':'Predicted deadline'}: ${fmtDate(ds)} ${confChip(o)}</div>`:''}
  </div>`;
}

function barRow(parts){
  const keys=[['medium','Medium'],['format','Format'],['environment','Venue'],
              ['durability','Duration'],['budget','Budget'],['theme','Theme']];
  return `<div class="bars">${keys.map(([k,l])=>{
    const v=Math.round((parts[k]||0)*100);
    const cls = v<40?'lo':v<70?'mid':'';
    return `<div class="bar"><div class="bk">${l}</div><div class="bt"><div class="bf ${cls}" style="width:${v}%"></div></div></div>`;
  }).join('')}</div>`;
}

function matchPanel(o){
  const m = o.match; if(!m) return '';
  const v = VERDICT_META[m.verdict];
  let h = `<div class="sect">Do you already have something for this?</div>`;
  h += `<div class="matchbox">
    <div class="top">
      <div class="grow">
        <div class="pn">${esc(m.projectName)}</div>
        <div class="bl">${esc(v.blurb)}</div>
      </div>
      <div style="text-align:right;flex:0 0 auto">
        ${verdictPill(m)}
        <div style="font-size:11px;color:var(--muted);margin-top:5px">${m.score}/100 fit</div>
      </div>
    </div>
    ${barRow(m.parts)}
    <ul class="worklist">
      ${m.blockers.map(b=>`<li class="stop">${esc(b)}</li>`).join('')}
      ${m.reasons.map(r=>`<li class="good">${esc(r)}</li>`).join('')}
      ${m.work.map(w=>`<li>${esc(w)}</li>`).join('')}
    </ul>
  </div>`;

  const alts = (o.matchAll||[]).filter(x=>x.projectId!==m.projectId)
    .sort((a,b)=>b.score-a.score).slice(0,5);
  if(alts.length){
    h += `<div style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:14px 0 8px">Your other work against this</div>`;
    alts.forEach(a=>{
      const av=VERDICT_META[a.verdict];
      h+=`<div class="altmatch" onclick="event.stopPropagation();showMatchDetail('${o.id}','${a.projectId}')">
        <div class="grow"><div style="font-size:13.5px;font-weight:600">${esc(a.projectName)}</div>
        <div style="font-size:11.5px;color:var(--muted);margin-top:2px">${a.score}/100</div></div>
        <span class="vd ${av.cls}">${av.icon} ${av.label}</span>
      </div>`;
    });
  }
  return h;
}

function showMatchDetail(oid, pid){
  const o = allOpps().find(x=>x.id===oid);
  const m = (o.matchAll||[]).find(x=>x.projectId===pid); if(!m) return;
  const v = VERDICT_META[m.verdict];
  let h=`<div class="mhead"><div style="font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700">${esc(o.name)}</div>
    <h3 style="margin:5px 0 9px;font-size:18px">${esc(m.projectName)}</h3>${verdictPill(m)}
    <span style="font-size:12px;color:var(--muted);margin-left:8px">${m.score}/100 fit</span></div>
    <div class="mbody">
    <div style="font-size:13.5px;color:var(--text2);line-height:1.6;margin-bottom:12px">${esc(v.blurb)}</div>
    ${barRow(m.parts)}
    <ul class="worklist" style="margin-top:14px">
      ${m.blockers.map(b=>`<li class="stop">${esc(b)}</li>`).join('')}
      ${m.reasons.map(r=>`<li class="good">${esc(r)}</li>`).join('')}
      ${m.work.map(w=>`<li>${esc(w)}</li>`).join('')}
    </ul>
    <div class="btnrow"><button class="btn-s" onclick="openDetail('${oid}')">← Back to opportunity</button></div>
    </div>`;
  $('modalContent').innerHTML=h;
}

/* ---------- detail modal ---------- */
function openDetail(id){
  const o = allOpps().find(x=>x.id===id); if(!o) return;
  const ds=effDate(o), d=daysTo(ds);
  const u = S.user[id]||{};

  let h=`<div class="mhead">
    <div style="font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700">${esc(o.org)}</div>
    <h3 style="margin:5px 0 9px;font-size:19px">${esc(o.name)}</h3>
    <div class="row wrap" style="gap:5px">
      ${statusChip(o)}
      <span class="chip">${esc(o.city)}, ${esc(o.country)}</span>
      ${medChips(o.mediums)}
    </div>
  </div><div class="mbody">`;

  if(o.warning) h+=`<div class="warn ${o.status==='at_risk'||/CLOSES|ELIGIBILITY|AGE LIMIT/.test(o.warning)?'red':''}"><b>⚠ ${esc(o.warning)}</b></div>`;

  // Apply CTA
  const canApply = ['open','rolling'].includes(o.status);
  h+=`<div class="btnrow" style="margin-top:4px">
    ${o.applyUrl?`<a class="btn ${canApply?'btn-p':'btn-s'}" href="${esc(o.applyUrl)}" target="_blank" rel="noopener">${canApply?'⚡ Apply now':esc(o.applyLabel||'Open call page')}</a>`:''}
    <a class="btn btn-g" href="${esc(o.website)}" target="_blank" rel="noopener">Website ↗</a>
    ${ds?`<button class="btn-s" onclick="addOneToCal('${o.id}')">📅 Add to calendar</button>`:''}
  </div>`;

  // dates
  h+=`<div class="sect" style="margin-top:20px">Key dates</div>`;
  if(o.deadline){
    h+=`<div class="drow"><div class="dk">Application deadline</div><div class="dv"><strong style="font-size:16px">${fmtDate(o.deadline)}</strong> ${d>=0?`— ${d} days away`:'— passed'} ${confChip(o)}</div></div>`;
  } else if(o.predictedDeadline){
    h+=`<div class="drow"><div class="dk">Predicted next deadline</div><div class="dv"><strong style="font-size:16px">${fmtDate(o.predictedDeadline)}</strong> ${d>=0?`— ~${d} days away`:''} ${confChip(o)}</div></div>`;
  } else {
    h+=`<div class="drow"><div class="dk">Deadline</div><div class="dv">${confChip(o)}</div></div>`;
  }
  if(o.opensDate) h+=`<div class="drow"><div class="dk">Call opens</div><div class="dv">${fmtDate(o.opensDate)}</div></div>`;
  if(o.basis) h+=`<div class="drow"><div class="dk">How this date was derived</div><div class="dv">${esc(o.basis)}</div></div>`;
  if(o.eventWindow) h+=`<div class="drow"><div class="dk">Festival / event window</div><div class="dv">${esc(o.eventWindow)}</div></div>`;

  // money & fit
  h+=`<div class="sect">Money & fit</div>`;
  h+=`<div class="drow"><div class="dk">What they pay</div><div class="dv">${esc(o.money)}</div></div>`;
  h+=`<div class="drow"><div class="dk">What they accept</div><div class="dv" style="margin-bottom:6px">${medChips(o.mediums)}</div>${alignBlock(o.align)}</div>`;

  // about
  h+=`<div class="sect">About the opportunity</div>`;
  h+=`<div class="drow"><div class="dk">What they program</div><div class="dv">${esc(o.what)}</div></div>`;
  if(o.selection) h+=`<div class="drow"><div class="dk">Selection & criteria</div><div class="dv">${esc(o.selection)}</div></div>`;
  if(o.scale) h+=`<div class="drow"><div class="dk">Scale & prestige</div><div class="dv">${esc(o.scale)}</div></div>`;
  if(o.requirements) h+=`<div class="drow"><div class="dk">Application requirements</div><div class="dv">${esc(o.requirements)}</div></div>`;

  if(o.intel) h+=`<div class="intel"><div class="lbl">◈ Strategic read</div><p>${esc(o.intel)}</p></div>`;

  // match panel
  h += matchPanel(o);

  // pitch window — for targets with no published call
  if(o.pitchWindow){
    h += `<div class="sect">When to pitch</div>` + windowBlock(o.pitchWindow);
  }

  // contact points
  if(o.contacts && o.contacts.length){
    h += `<div class="sect">Who to contact</div>`;
    o.contacts.forEach(c=>{
      let link;
      if(c.type==='email') link=`<a href="mailto:${esc(c.channel)}">${esc(c.channel)}</a>`;
      else if(c.type==='phone') link=`<a href="tel:${esc(c.channel.replace(/[^0-9+]/g,''))}">${esc(c.channel)}</a>`;
      else if(c.type==='web'||c.type==='form'||c.type==='list'||c.type==='social') link=`<a href="${esc(c.channel)}" target="_blank" rel="noopener">${esc(c.channel)}</a>`;
      else link=`<span style="font-size:12.5px;color:var(--text2)">${esc(c.channel)}</span>`;
      h += `<div class="contact"><div class="grow">
        <div class="cn">${esc(c.name)}</div>
        <div class="cr">${esc(c.role||'')}</div>
        <div style="margin-top:5px">${link}</div>
        ${c.note?`<div class="cnote">${esc(c.note)}</div>`:''}
      </div></div>`;
    });
  }

  // application kit
  h += `<div class="btnrow"><button class="btn-p btn-full" onclick="openKit('${o.id}')">📋 Build application kit</button></div>`;

  // advice that applies to this specific opportunity
  const adv = (OPP_ADVICE[o.id]||[]).map(id=>INSIGHTS.find(x=>x.id===id)).filter(Boolean);
  if(adv.length){
    h += `<div class="sect">Advice for this application</div>`;
    adv.forEach(a=>{
      h += `<div class="advice">
        <div class="at">${esc(a.title)}</div>
        <div class="aw">${esc(a.who)}${a.role?' · '+esc(a.role):''}</div>
        ${a.quote?`<div class="aq">“${esc(a.quote)}”</div>`:''}
        <div class="ab">${esc(a.body.split('\n\n')[0])}</div>
        ${a.url?`<div style="margin-top:7px"><a href="${esc(a.url)}" target="_blank" rel="noopener" style="font-size:11.5px">Source ↗</a></div>`:''}
      </div>`;
    });
  }

  // your tracking
  h+=`<div class="sect">Your tracking</div>`;
  h+=`<div class="field"><label>Interest level ${o.interestManual?'<span style="color:var(--accent)">· set by you</span>':'<span style="color:var(--muted)">· suggested</span>'}</label>
  <div class="filters" style="margin:0 0 8px">
    ${['Not interested','Low','Medium','High','Very interested'].map((l,i)=>
      `<div class="fchip ${o.interest===i?'on':''}" onclick="setInterest('${o.id}',${i})">${l}</div>`).join('')}
  </div>`;
  if(o.suggested && o.suggested.why.length){
    h+=`<div style="margin-bottom:6px">${o.suggested.why.map(w=>
      `<span class="whychip"><span class="s ${w.v==='+'?'p':w.v==='−'?'m':'n'}">${w.v}</span>${esc(w.t)}</span>`).join('')}</div>`;
  }
  if(o.interestManual) h+=`<button class="btn-g btn-sm" onclick="setUser('${o.id}',{interestManual:false});clearMatchCache();openDetail('${o.id}');renderOpps()">Reset to suggested</button>`;
  h+=`</div>`;
  h+=`<div class="field"><label>Your status</label><select id="uStatus" onchange="setUser('${o.id}',{status:this.value})">
    ${['','researching','watching for open call','drafting','submitted','accepted','rejected','declined by me','not pursuing']
      .map(s=>`<option value="${s}" ${o.userStatus===s?'selected':''}>${s||'— none —'}</option>`).join('')}
  </select></div>`;
  h+=`<div class="field"><label>Linked project</label><select onchange="setUser('${o.id}',{linkedProject:this.value})">
    <option value="">— none —</option>
    ${S.projects.map(p=>`<option value="${p.id}" ${o.linkedProject===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
  </select></div>`;
  h+=`<div class="field"><label>Your notes</label><textarea id="uNotes" placeholder="Contacts, ideas, what you'd pitch here…">${esc(o.userNotes)}</textarea></div>`;
  h+=`<div class="btnrow"><button class="btn-p" onclick="saveTracking('${o.id}')">Save notes</button>
    <button class="btn-g" onclick="setUser('${o.id}',{dismissed:true});closeModal();renderOpps();renderTabs();toast('Hidden from your list')">Hide this</button></div>`;

  if(o.sources&&o.sources.length){
    h+=`<div class="sect">Sources</div><div class="srcs">${o.sources.map(s=>`<a href="${esc(s)}" target="_blank" rel="noopener">${esc(s)}</a>`).join('<br>')}</div>`;
  }

  h+=`</div>`;
  $('modalContent').innerHTML=h;
  $('modal').classList.add('on');
}
function setInterest(id, lvl){
  setUser(id,{interest:lvl, interestManual:true});
  clearMatchCache(); openDetail(id); renderTabs();
  toast('Interest set — the app will learn from this');
}
function saveTracking(id){
  setUser(id,{notes:$('uNotes').value});
  clearMatchCache();
  toast('Saved'); closeModal(); renderOpps();
}
function closeModal(){ $('modal').classList.remove('on'); }
$('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });

/* ---------- application kit ---------- */
function kitField(label, value, note){
  const words = String(value||'').trim().split(/\s+/).filter(Boolean).length;
  return `<div class="kit">
    <div class="kl"><span>${esc(label)}</span><span class="kcount">${words} words</span></div>
    <div class="kv">${esc(value||'')}</div>
    ${note?`<div style="font-size:11px;color:var(--muted);margin-top:7px;font-style:italic">${esc(note)}</div>`:''}
  </div>`;
}

function openKit(oid, pid){
  const o = allOpps().find(x=>x.id===oid); if(!o) return;
  const m = o.match;
  const projId = pid || (m && m.projectId) || (S.projects[0]||{}).id;
  const p = S.projects.find(x=>x.id===projId) || S.projects[0];
  const spec = SPECS[o.id] || {};
  const prof = S.profile || {};

  // pick media whose tags overlap what the call is about
  const wanted = (spec.mediums||[]).concat(spec.themes||[]).map(x=>String(x).toLowerCase());
  const media = (p.media||[]).map(mm=>{
    const tags=(mm.tags||[]).map(t=>t.toLowerCase());
    const hits=tags.filter(t=>wanted.some(w=>w.includes(t)||t.includes(w))).length;
    return {mm, hits};
  }).sort((a,b)=>b.hits-a.hits);

  const money = spec.payMax!=null ? spec.payMax : spec.payMin;
  let tier=null;
  (p.priceTable||[]).forEach(t=>{ if(money==null || t.price<=money){ if(!tier||t.price>tier.price) tier=t; } });

  const why = [
    o.align ? `${o.name} programs ${(o.mediums||[]).map(x=>(MEDIUMS[x]||{}).short).filter(Boolean).join(', ')}.` : '',
    (spec.themes||[]).length ? `Their stated themes are ${spec.themes.join(', ')}.` : '',
    `${p.name} sits at the intersection of live performance and technology: ${p.oneLine||''}`
  ].filter(Boolean).join(' ');

  let h = `<div class="mhead">
    <div style="font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700">Application kit</div>
    <h3 style="margin:5px 0 8px;font-size:18px">${esc(o.name)}</h3>
    <div class="row wrap" style="gap:6px">${verdictPill(m)}<span class="chip">${esc(p.name)}</span></div>
  </div><div class="mbody">`;

  h += `<div style="font-size:13px;color:var(--text2);line-height:1.65;margin-bottom:14px">Pre-filled from your project profile and My Info, shaped to what this call actually asks for. Review and edit every field before sending — then copy the whole kit.</div>`;

  if(S.projects.length>1){
    h += `<div class="field"><label>Pitch which project?</label><select onchange="openKit('${oid}', this.value)">
      ${S.projects.map(x=>`<option value="${x.id}" ${x.id===projId?'selected':''}>${esc(x.name)}</option>`).join('')}
    </select></div>`;
  }

  h += kitField('Applicant', prof.name || '(set your name in My Info)', null);
  h += kitField('Contact', [prof.email,prof.phone,prof.website].filter(Boolean).join(' · ') || '(set contact details in My Info)', null);
  h += kitField('Project title', p.name, null);
  h += kitField('Short description', p.oneLine||p.short||'', 'Most calls cap this at 100–150 words. Trim to fit rather than padding.');
  h += kitField('Full description', p.long||'', null);
  h += kitField('Why this opportunity', why, 'Site-specificity is the most common failure point for touring work. Replace the generic clause with something only true of this venue or city.');

  if(spec.needs) h += kitField('What they asked for', spec.needs, 'Answer this literally, in their words, near the top of the form.');

  const feas = [
    p.crew ? `Crew: ${p.crew} people travelling from ${p.originAirport||'Austin, TX'}.` : '',
    p.transport ? `Transport: ${p.transport}` : '',
    (p.needs||[]).length ? `Site requirements: ${(p.needs||[]).join('; ')}.` : '',
    p.showMinutes ? `Runtime: ${p.showMinutes} minutes.` : '',
    prof.insurance ? `Insurance and credentials: ${prof.insurance}` : '(Add your insurance and aviation credentials in My Info — feasibility is a scored criterion at several of these calls.)'
  ].filter(Boolean).join('\n');
  h += kitField('Technical feasibility', feas, 'This section is where you beat the field. Most fine-artist applicants are weak here and you are strong — make it impressive, not dutiful.');

  const budget = [
    tier ? `Proposed scale: ${tier.label} — $${tier.price.toLocaleString()}.` : (p.priceMin?`Fee range: $${p.priceMin.toLocaleString()}${p.priceMax?'–$'+p.priceMax.toLocaleString():''}.`:''),
    spec.payNote ? `Their published terms: ${spec.payNote}` : '',
    prof.pricing ? `Standard terms: ${prof.pricing}` : ''
  ].filter(Boolean).join('\n');
  h += kitField('Budget', budget, 'Get written vendor quotes for drone fleet, batteries and fabrication. Panels cannot intuit these costs, and quotes turn an unfamiliar number into a verified one.');

  h += kitField('Artist bio', prof.bioShort || '(set a short bio in My Info)', null);

  if(media.length){
    const list = media.slice(0,6).map(x=>`• ${x.mm.label} (${x.mm.type})${x.mm.url?' — '+x.mm.url:''}${x.hits?'  ← matches this call':''}`).join('\n');
    h += kitField('Suggested media', list, 'Ranked by tag overlap with this call. Cut a bespoke sample — a generic showreel reads as an artist without a through-line, and panels give work samples about 20 minutes total.');
  } else {
    h += kitField('Suggested media', '(No media in this project yet — add tagged links under Projects and they will be matched to each call automatically.)', null);
  }

  if(m && m.work.length){
    h += kitField('Before you submit', m.work.map(w=>'• '+w).join('\n'), 'From the match analysis — these are the gaps between what you have and what they want.');
  }

  h += `<div class="btnrow">
    <button class="btn-p" onclick="copyKit('${oid}','${projId}')">Copy entire kit</button>
    ${o.applyUrl?`<a class="btn btn-s" href="${esc(o.applyUrl)}" target="_blank" rel="noopener">Open application ↗</a>`:''}
    <button class="btn-g" onclick="openDetail('${oid}')">← Back</button>
  </div>
  <div style="font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.6">This builds the answers — it does not submit for you. Nearly every call uses its own portal with logins, file uploads and CAPTCHAs, and auto-submitting into those breaks terms of service and risks sending something you have not read. Copy, paste, edit, send.</div>
  </div>`;

  $('modalContent').innerHTML = h;
  $('modal').classList.add('on');
}

function copyKit(oid, pid){
  const txt = [...document.querySelectorAll('#modalContent .kit')].map(k=>{
    const label = k.querySelector('.kl span').textContent;
    const val = k.querySelector('.kv').textContent;
    return label.toUpperCase() + '\n' + val;
  }).join('\n\n');
  navigator.clipboard.writeText(txt).then(()=>toast('Kit copied to clipboard'))
    .catch(()=>toast('Could not access clipboard'));
}

/* ---------- insights ---------- */
let iTag='all', iBookmarked=false;
function renderInsights(){
  S.bookmarks = S.bookmarks || [];
  let list = INSIGHTS.slice();
  if(iBookmarked) list = list.filter(x=>S.bookmarks.includes(x.id));
  if(iTag!=='all') list = list.filter(x=>(x.tags||[]).includes(iTag));
  list.sort((a,b)=> (b.pinned?1:0)-(a.pinned?1:0) || (b.added||'').localeCompare(a.added||''));

  const tags = INSIGHT_TAGS.filter(t=>INSIGHTS.some(i=>(i.tags||[]).includes(t)));
  let h=`<h2>Insights</h2><p class="sub">Attributable advice from curators, jurors, grant officers and consultants. Updated ${fmtDate(INSIGHTS_UPDATED)} — the weekly scan adds to this. Bookmark the ones you want to keep.</p>`;
  h+=`<div class="filters">
    <div class="fchip ${iTag==='all'&&!iBookmarked?'on':''}" onclick="iTag='all';iBookmarked=false;renderInsights()">All</div>
    <div class="fchip ${iBookmarked?'on':''}" onclick="iBookmarked=!iBookmarked;renderInsights()">★ Saved${S.bookmarks.length?' · '+S.bookmarks.length:''}</div>
    ${tags.map(t=>`<div class="fchip ${iTag===t?'on':''}" onclick="iTag='${t}';iBookmarked=false;renderInsights()">${t}</div>`).join('')}
  </div>`;

  if(!list.length){
    h+=`<div class="empty"><div class="ic">★</div>${iBookmarked?'No saved insights yet. Tap the star on any insight to keep it here.':'Nothing in this category.'}</div>`;
  }
  list.forEach(x=>{
    const saved = S.bookmarks.includes(x.id);
    h+=`<div class="card">
      <div class="row between" style="align-items:flex-start;gap:10px">
        <div class="grow">
          ${x.pinned?'<span class="chip violet" style="margin-bottom:7px">Key</span>':''}
          <h3 style="margin:0 0 5px">${esc(x.title)}</h3>
          <div style="font-size:11.5px;color:var(--muted)">${esc(x.who)}${x.role?' · '+esc(x.role):''}</div>
        </div>
        <span class="bm ${saved?'on':''}" onclick="toggleBookmark('${x.id}')">${saved?'★':'☆'}</span>
      </div>
      ${x.quote?`<div class="qt">“${esc(x.quote)}”</div>`:''}
      <div style="font-size:13.5px;line-height:1.7;color:var(--text2);margin-top:9px;white-space:pre-wrap">${esc(x.body)}</div>
      <div class="row between" style="margin-top:11px;gap:8px;flex-wrap:wrap">
        <div>${(x.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
        ${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener" style="font-size:12px">Source ↗</a>`:''}
      </div>
    </div>`;
  });

  if(!iBookmarked && iTag==='all'){
  h+=`<div class="sect">Where to watch for new opportunities</div>`;
  WATCH_CHANNELS.forEach(c=>{
    h+=`<div class="card"><div class="row between"><div class="grow">
      <div class="oname" style="font-size:14px">${esc(c.name)}</div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.6">${esc(c.note)}</div>
    </div><a class="btn btn-g btn-sm" href="${esc(c.url)}" target="_blank" rel="noopener">Open ↗</a></div></div>`;
  });
  }

  $('v-insights').innerHTML=h;
}
function toggleBookmark(id){
  S.bookmarks = S.bookmarks || [];
  const i = S.bookmarks.indexOf(id);
  if(i>=0) S.bookmarks.splice(i,1); else S.bookmarks.push(id);
  save(); renderInsights();
  toast(i>=0?'Removed from saved':'Saved');
}

/* ---------- projects ---------- */
const READY_LABEL = {ready:'Ready', variant:'Variant', adaptable:'Adaptable',
                     development:'In development', concept:'Concept'};

function renderProjects(){
  let h=`<h2>Projects</h2><p class="sub">Your catalogue, and where each piece actually lands. Tap a project to see every opportunity it fits.</p>`;
  const opps = allOpps();
  h += S.projects.map(p=>{
    const scored = opps.map(o=>({o, m:(o.matchAll||[]).find(x=>x.projectId===p.id)}))
      .filter(x=>x.m);
    const ready = scored.filter(x=>x.m.verdict==='READY').length;
    const light = scored.filter(x=>x.m.verdict==='LIGHT').length;
    const rel   = scored.filter(x=>x.m.verdict==='RELATIONSHIP').length;
    return `<div class="card clk" onclick="openProjectFits('${p.id}')">
      <div class="row between" style="align-items:flex-start">
        <div class="grow">
          <div class="oname">${esc(p.name)}</div>
          <div style="font-size:13px;color:var(--text2);margin-top:5px;line-height:1.6">${esc(p.oneLine||p.short||'')}</div>
        </div>
        <span class="readybadge ${p.readiness||'ready'}">${READY_LABEL[p.readiness]||'Ready'}</span>
      </div>
      <div class="row wrap" style="gap:7px;margin-top:11px">
        ${ready?`<span class="vd green">✓ ${ready} ready</span>`:''}
        ${light?`<span class="vd cyan">◐ ${light} light adapt</span>`:''}
        ${rel?`<span class="vd violet">◈ ${rel} relationship</span>`:''}
      </div>
      ${p.priceMin?`<div style="margin-top:10px" class="money">$${p.priceMin.toLocaleString()}${p.priceMax&&p.priceMax!==p.priceMin?' – $'+p.priceMax.toLocaleString():''}</div>`:''}
      <div style="margin-top:9px">${(p.tags||[]).slice(0,6).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
    </div>`;
  }).join('');
  h+=`<div class="btnrow"><button class="btn-s" onclick="openProject(null)">+ New project</button></div>`;
  $('v-projects').innerHTML=h;
}

function openProjectFits(pid){
  const p = S.projects.find(x=>x.id===pid); if(!p) return;
  const opps = allOpps();
  const scored = opps.map(o=>({o, m:(o.matchAll||[]).find(x=>x.projectId===pid)}))
    .filter(x=>x.m);
  const rank={READY:7,LIGHT:6,MODERATE:5,RELATIONSHIP:4,UNFUNDED:3,MAJOR:2,BLOCKED:1};
  scored.sort((a,b)=>(rank[b.m.verdict]-rank[a.m.verdict])||(b.m.score-a.m.score));

  let h=`<div class="mhead">
    <div class="row between" style="align-items:flex-start">
      <div class="grow"><h3 style="margin:0;font-size:18px">${esc(p.name)}</h3></div>
      <span class="readybadge ${p.readiness||'ready'}">${READY_LABEL[p.readiness]||'Ready'}</span>
    </div>
  </div><div class="mbody">
  <div style="font-size:13.5px;color:var(--text2);line-height:1.65">${esc(p.oneLine||'')}</div>`;

  if(p.limits) h+=`<div class="warn" style="margin-top:12px"><b>Constraint:</b> ${esc(p.limits)}</div>`;
  if(p.strengths) h+=`<div class="intel"><div class="lbl">◈ What this wins on</div><p>${esc(p.strengths)}</p></div>`;

  if(p.priceTable&&p.priceTable.length){
    h+=`<div class="sect">Pricing</div>`;
    p.priceTable.forEach(t=>{
      h+=`<div class="row between" style="padding:7px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:13.5px">${esc(t.label)}</span>
        <span class="money">$${t.price.toLocaleString()}</span></div>`;
    });
    if(p.priceNote) h+=`<div style="font-size:12px;color:var(--muted);margin-top:8px">${esc(p.priceNote)}</div>`;
  }

  const groups=[['READY','Pitch as-is'],['LIGHT','Light adaptation'],['MODERATE','Moderate build'],
                ['RELATIONSHIP','Relationship plays'],['UNFUNDED','Fits but underfunded'],
                ['MAJOR','Major build'],['BLOCKED','Not eligible']];
  groups.forEach(([v,label])=>{
    const g=scored.filter(x=>x.m.verdict===v);
    if(!g.length) return;
    h+=`<div class="sect">${label} · ${g.length}</div>`;
    g.slice(0,14).forEach(({o,m})=>{
      const ds=effDate(o), d=daysTo(ds);
      h+=`<div class="altmatch" onclick="openDetail('${o.id}')">
        <div class="grow">
          <div style="font-size:13.5px;font-weight:600">${esc(o.name)}</div>
          <div style="font-size:11.5px;color:var(--muted);margin-top:2px">
            ${esc(moneyLabel(o))}${ds&&d>=0?` · ${d}d`:''} · ${m.score}/100</div>

function snapshot(){
  const s={};
  ALL_BASE.forEach(o=>{ s[o.id]={d:o.deadline||null,p:o.predictedDeadline||null,st:o.status}; });
  return s;
}
function checkRevisions(){
  const now=snapshot();
  if(!S.seenData){ S.seenData=now; save(); toast('Baseline saved — future changes will be flagged'); return; }
  const revs=[];
  const when=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  Object.keys(now).forEach(id=>{
    const old=S.seenData[id], cur=now[id];
    const o=ALL_BASE.find(x=>x.id===id);
    if(!old){ revs.push({name:o.name,change:'New opportunity added to the dataset.',when}); return; }
    if(old.d!==cur.d){
      revs.push({name:o.name,change: !old.d&&cur.d
        ? `Deadline CONFIRMED as ${fmtDate(cur.d)} (was a prediction).`
        : `Deadline changed: ${old.d?fmtDate(old.d):'none'} → ${cur.d?fmtDate(cur.d):'none'}.`,when});
    } else if(old.p!==cur.p){
      revs.push({name:o.name,change:`Predicted deadline revised: ${old.p?fmtDate(old.p):'none'} → ${cur.p?fmtDate(cur.p):'none'}.`,when});
    }
    if(old.st!==cur.st) revs.push({name:o.name,change:`Status changed: ${old.st} → ${cur.st}.`,when});
  });
  S.seenData=now;
  if(revs.length){
    S.revisions=(S.revisions||[]).concat(revs); save();
    if('Notification' in window && Notification.permission==='granted')
      new Notification('Never Miss Again',{body:`${revs.length} date revision${revs.length>1?'s':''} detected. Open the app to review.`});
    toast(`${revs.length} revision${revs.length>1?'s':''} found`);
  } else { save(); toast('No changes since last check'); }
  renderSettings(); renderTabs();
}

/* ---------- calendar export ---------- */
function icsDate(ds){ return ds.replace(/-/g,''); }
function icsEsc(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function buildICS(confirmedOnly){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Never Miss Again//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Never Miss Again'];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  let n=0;
  allOpps().forEach(o=>{
    const ds = o.deadline || (confirmedOnly?null:o.predictedDeadline);
    if(!ds) return;
    const d=daysTo(ds); if(d<-30) return;
    const pred = !o.deadline;
    const end=new Date(ds+'T00:00:00'); end.setDate(end.getDate()+1);
    const endS=end.toISOString().slice(0,10).replace(/-/g,'');
    const title=`${pred?'[PREDICTED] ':''}Deadline: ${o.name}`;
    const desc=[
      pred?`⚠ PREDICTED DATE (${o.predictedConfidence} confidence) — verify on the official site.`:'✓ Confirmed deadline.',
      o.basis?`Basis: ${o.basis}`:'',
      `Money: ${o.money}`,
      `What: ${o.what}`,
      o.requirements?`Requirements: ${o.requirements}`:'',
      o.intel?`Strategic read: ${o.intel}`:'',
      o.warning?`⚠ ${o.warning}`:'',
      `Apply: ${o.applyUrl||o.website}`
    ].filter(Boolean).join('\n\n');
    L.push('BEGIN:VEVENT',`UID:nma-${o.id}-${icsDate(ds)}@nevermissagain`,`DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${icsDate(ds)}`,`DTEND;VALUE=DATE:${endS}`,
      `SUMMARY:${icsEsc(title)}`,`DESCRIPTION:${icsEsc(desc)}`,
      `LOCATION:${icsEsc(o.city+', '+o.country)}`,`URL:${icsEsc(o.applyUrl||o.website)}`);
    [[-30,'30 days'],[-14,'2 weeks'],[-7,'1 week'],[-2,'2 days']].forEach(([days,lbl])=>{
      L.push('BEGIN:VALARM',`TRIGGER:-P${Math.abs(days)}D`,'ACTION:DISPLAY',
        `DESCRIPTION:${icsEsc(lbl+' until '+o.name+' deadline')}`,'END:VALARM');
    });
    L.push('END:VEVENT'); n++;

    // event window as a note event
    if(o.eventWindow && !pred){
      // skip — keep the calendar focused on actionable deadlines
    }
  });
  L.push('END:VCALENDAR');
  return {ics:L.join('\r\n'), count:n};
}
function exportICS(confirmedOnly){
  const {ics,count}=buildICS(confirmedOnly);
  dl(new Blob([ics],{type:'text/calendar'}), `never-miss-again${confirmedOnly?'-confirmed':''}.ics`);
  toast(`${count} dates exported`);
}
function addOneToCal(id){
  const o=allOpps().find(x=>x.id===id); if(!o) return;
  const ds=effDate(o); if(!ds){toast('No date to add');return;}
  const end=new Date(ds+'T00:00:00'); end.setDate(end.getDate()+1);
  const pred=!o.deadline;
  const url='https://calendar.google.com/calendar/render?action=TEMPLATE'
    +'&text='+encodeURIComponent(`${pred?'[PREDICTED] ':''}Deadline: ${o.name}`)
    +'&dates='+icsDate(ds)+'/'+end.toISOString().slice(0,10).replace(/-/g,'')
    +'&details='+encodeURIComponent(
      (pred?`⚠ PREDICTED (${o.predictedConfidence} confidence) — verify on the official site.\n\n`:'✓ Confirmed deadline.\n\n')
      +`Money: ${o.money}\n\nApply: ${o.applyUrl||o.website}`)
    +'&location='+encodeURIComponent(o.city+', '+o.country);
  window.open(url,'_blank');
}
function dl(blob,name){
  const u=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);
}

    </div>
    <div class="g2">
      <div class="field"><label>Deadline</label><input type="date" id="c_deadline"></div>
      <div class="field"><label>Category</label><select id="c_cat">${['light','projection','installation','drone','digital','newmedia','circus','prize','megaevent','immersive','other'].map(c=>`<option>${c}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>Apply URL</label><input type="url" id="c_url"></div>
    <div class="field"><label>Money / fee</label><input type="text" id="c_money" placeholder="e.g. €10,000 commission"></div>
    <div class="field"><label>What it is</label><textarea id="c_what"></textarea></div>
    <div class="btnrow"><button class="btn-p" onclick="saveCustom()">Add opportunity</button></div>
  </div>`;
  $('modalContent').innerHTML=h; $('modal').classList.add('on');
}
function saveCustom(){
  const n=$('c_name').value.trim(); if(!n){toast('Name required');return;}
  S.custom.push({
    id:uid(), name:n, org:$('c_org').value||'—',
    city:$('c_city').value||'—', country:$('c_country').value||'—', region:'Custom',
    category:$('c_cat').value, tier:'mid',
    website:$('c_url').value||'', applyUrl:$('c_url').value||'',
    status:$('c_deadline').value?'open':'uncertain',
    deadline:$('c_deadline').value||null, deadlineConfidence:$('c_deadline').value?'confirmed':'unknown',
    money:$('c_money').value||'Not specified', moneyTier:'unknown',
    fit:3, what:$('c_what').value||'Added by you.', drones:'unclear',
    selection:'', scale:'', requirements:'', intel:'', sources:[]
  });
  save(); closeModal(); renderOpps(); renderTabs(); toast('Added');
}

/* ---------- notifications ---------- */
function askNotif(){
  if(!('Notification' in window)){toast('Notifications not supported here');return;}
  Notification.requestPermission().then(p=>{
    $('notifBtn').textContent = p==='granted'?'Alerts on ✓':'Alerts';
    if(p==='granted'){ toast('Alerts enabled'); fireAlerts(); }
  });
}
function fireAlerts(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const marks=[30,14,7,2,0];
  allOpps().forEach(o=>{
    if(!o.deadline)return;
    const d=daysTo(o.deadline);
    if(marks.includes(d)){
      new Notification('Never Miss Again',{
        body: d===0?`Deadline TODAY: ${o.name}`:`${d} day${d===1?'':'s'} left to apply: ${o.name}`
      });
    }
  });
}

async function forceUpdate(){
  toast('Clearing cache…');
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.controller)
      navigator.serviceWorker.controller.postMessage('nuke-cache');
    if(window.caches){
      const keys = await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    if(navigator.serviceWorker){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
  }catch(e){}
  setTimeout(()=>location.reload(true), 600);
}

function toggleArtist(k){ S.artist[k]=!S.artist[k]; save(); clearMatchCache(); renderSettings(); }
function saveArtist(){
  const b=parseInt($('ar_birth').value,10);
  S.artist.birthYear = isNaN(b)?null:b;
  save(); clearMatchCache(); recomputePrefs();
  toast('Eligibility updated — matches recalculated'); renderSettings();
}

/* ---------- init ---------- */
$('compiledDate').textContent=fmtDate(DATA_COMPILED);
recomputePrefs();
if('Notification' in window && Notification.permission==='granted') $('notifBtn').textContent='Alerts on ✓';
if(!S.seenData){ S.seenData=snapshot(); save(); }
renderTabs(); go('dash');
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
setTimeout(fireAlerts,1500);
setInterval(fireAlerts,1000*60*60*12);

</script>
